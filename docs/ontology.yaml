    source: hub_config + parenting_schedule_anchor + parenting_home_days
    rendering:
      semantic: Settings
      systems: Settings Panel
      technical: "#settings-panel (position:fixed right slide-in, z-index:9999)"
      compliance: (not shown)
    definition: >
      The slide-in settings panel (from the right edge). Contains all
      configurable fields: family name, Google OAuth client ID, calendar ID,
      slideshow interval, max photos, parenting schedule, and theme picker.
    relationships:
      - target: hub_config
        type: derives_from
