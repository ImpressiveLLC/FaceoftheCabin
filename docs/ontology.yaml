# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — CHORES
# Elements defining, assigning, tracking, and displaying daily chore state.
# Source: CHORES constant array + localStorage["smrekar_chore_completion"]
# ═══════════════════════════════════════════════════════════════════════════

  - id: chore_definition
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Brush teeth"
    source: CHORES constant array (hardcoded in family-hub.html)
    rendering:
      semantic: Chore (e.g. "Brush teeth", "Make bed")
      systems: Chore Definition
      technical: CHORES[{id, label, tags, minAge}] constant array
      compliance: (not shown)
    definition: >
      A named household task with a minimum age threshold and tags indicating
      category (hygiene, tidy, responsibility, learning, care).
      Defines the universe of tasks that can be assigned to kids.
    relationships:
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Static constant in code. choresByAge(age) filters CHORES where
      minAge <= age to return the eligible subset for a given child.
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_assignment, family_profile]
    notes: >
      Current chore IDs: brush_teeth, make_bed, reading, clear_table,
      unload_dishwasher, take_trash, walk_frankie, homework (age >= 9);
      set_table, wipe_table, outfit_ready, lunch_backpack, put_away_laundry
      (age < 9). Rotating daily extra selected by dayOfMonth % rotating.length.

  - id: chore_assignment
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Today's chores for Sam"
    source: chore_definition + family_profile + parenting_home_days + system clock
    rendering:
      semantic: Today's chores for {kid name}
      systems: Chore Assignment (day × kid)
      technical: defaultAssignments(dayKey, kidId) → Chore[]
      compliance: (not shown)
    definition: >
      The computed list of chores assigned to a specific child on a specific
      calendar day. Derived from the child's age (for eligibility), the day
      of the month (for rotating extra chore), and the fixed daily set.
    relationships:
      - target: chore_definition
        type: derives_from
        cardinality: "N:1"
      - target: family_profile
        type: derives_from
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: chore_completion_state
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Source: kid.age + dayKey (YYYY-MM-DD).
      daily = [brush_teeth, make_bed, reading] (always assigned).
      rotating extra = rotating[parseInt(dayKey.split('-')[2]) % rotating.length].
      assignment = [...daily, extra].filter available by choresByAge(kid.age).
    relates_to:
      ui_components: [ui_today_chores_card, ui_chore_tracker_tab]
      elements: [chore_definition, family_profile, chore_completion_state]

  - id: chore_completion_state
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:boolean
    constraint:
      description: keyed by date + kidId + choreId; default false when absent; no expiry
    ui_display_name: "Done ✓"
    source: localStorage["smrekar_chore_completion"] (nested JSON object)
    rendering:
      semantic: Done ✓ / Not done yet
      systems: Chore Completion (day × kid × choreId → boolean)
      technical: COMP_KEY["smrekar_chore_completion"][dayKey][kidId][choreId] → boolean
      compliance: (not shown)
    definition: >
      The persisted record of which chores have been completed by which child
      on which day. Stored as a nested JSON structure keyed by date, kid ID,
      and chore ID. Written on every tap of a chore row.
    relationships:
      - target: chore_assignment
        type: depends_on
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      User taps chore row → toggleChoreCompletion(dayKey, kidId, choreId) →
      inverts boolean → writes back to localStorage.
      Read: getChoreState(dayKey, kidId, choreId) returns boolean (default false).
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_assignment, reward_eligibility, chore_daily_view, chore_daily_success]
    notes: >
      Structure: { "2026-07-27": { "sam": { "brush_teeth": true, ... }, ... } }.
      No expiry — historical data used for reward lookback window.
      KNOWN GAP (confirmed 2026-07-31, not a code bug): localStorage-only,
      so completion recorded on one device/browser is invisible after
      signing in on a different one — verified the toggle -> save -> persist
      -> reload path is internally consistent; the per-browser storage
      architecture is the actual cause. See chore_daily_success /
      chore_weekly_success below for the queued fix.

  - id: chore_daily_success
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: planned
    data_class: derived
    data_type: xsd:boolean
    ui_display_name: "Qualifying day"
    source: chore_completion_state, aggregated server-side (queued — not built yet)
    rendering:
      semantic: "Qualifying day (3+ chores done)"
      systems: Daily Chore Success Flag
      technical: "countDayCompleted(dayKey,kidId) >= 3 — today this is derived
        live, client-side, from chore_completion_state every time it's read"
      compliance: Daily Chore Threshold Record
    definition: >
      Whether a kid completed enough chores (the existing >=3 threshold
      already used by rewardEligibility()) on a given day to count as a
      "successful day." The comparison logic already exists and is correct
      — what's queued is persisting the *result* as a stored fact per day,
      not only computing it live from raw per-chore-per-day records, same
      reasoning as custody_day_log for the parenting schedule.
    relationships:
      - target: chore_completion_state
        type: derives_from
        cardinality: "N:1"
      - target: chore_weekly_success
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_today_chores_card]
      elements: [chore_completion_state, chore_weekly_success]
    notes: >
      QUEUED, NOT YET BUILT (2026-07-31). Needs a real /api/chores endpoint
      on cabin-backend (already running) backed by Postgres — same backend,
      same reasoning, as the queued /api/notes work already in ROADMAP.md
      Phase 1. One backend effort should cover raw completion records plus
      both derived aggregates below.

  - id: chore_weekly_success
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: planned
    data_class: derived
    data_type: xsd:boolean
    ui_display_name: "Reward-eligible week"
    source: chore_daily_success, aggregated over a rolling 7-day home-day window
    rendering:
      semantic: "Reward unlocked this week"
      systems: Weekly Chore Success Flag
      technical: "rewardEligibility(kidId, homeDays) — today this is derived
        live, client-side (qualifying >= 4 of the last 7 home days)"
      compliance: Weekly Reward Eligibility Record
    definition: >
      Whether a kid qualified for a reward in a rolling 7-day window (the
      existing >=4-qualifying-days threshold in reward_eligibility). Same
      "persist the derived fact, don't only compute it live" reasoning as
      chore_daily_success — lets a week's eligibility be looked up directly
      instead of re-walking 7 days of raw completion data every time.
    relationships:
      - target: chore_daily_success
        type: derives_from
        cardinality: "N:1"
      - target: reward_eligibility
        type: extends
        cardinality: "1:1"
    relates_to:
      ui_components: [ui_rewards_tab]
      elements: [chore_daily_success, reward_eligibility]
    notes: >
      QUEUED, NOT YET BUILT (2026-07-31). Same /api/chores backend effort
      as chore_daily_success.

  - id: chore_daily_view
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Today's chores and anything left from yesterday"
    source: chore_assignment + chore_completion_state + custody_status + yesterday_carryover
    rendering:
      semantic: Today's chores and anything left from yesterday
      systems: Daily Chore View (today + carryover)
      technical: renderChoreTracker() → #chore-tracker-body innerHTML
      compliance: (not shown)
    definition: >
      The primary chore interaction surface in the Dashboard's Chore Tracker
      tab. Shows: reward progress bar at top, today's chores with completion
      checkboxes, and any incomplete chores from yesterday (if kids were home).
      Weekly history is collapsed below a toggle.
    relationships:
      - target: chore_assignment
        type: derives_from
        cardinality: "N:1"
      - target: chore_completion_state
        type: derives_from
        cardinality: "N:1"
      - target: custody_status
        type: derives_from
        cardinality: "N:1"
      - target: reward_eligibility
        type: derives_from
        cardinality: "N:1"
      - target: yesterday_carryover
        type: derives_from
        cardinality: "N:1"
      - target: ui_chore_tracker_tab
        type: consumed_by
        cardinality: "1:1"
    relates_to:
      ui_components: [ui_chore_tracker_tab, reward_progress_bar]
      elements: [chore_assignment, chore_completion_state, custody_status,
                 yesterday_carryover, reward_eligibility]
    notes: >
      Carryover section (rose-tinted border) only appears when kids were
      home yesterday AND at least one chore was left incomplete.

  - id: yesterday_carryover
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Left over from yesterday"
    source: chore_completion_state + parenting_home_days
    rendering:
      semantic: Left over from yesterday
      systems: Yesterday Carryover Chores
      technical: >
        chores where !getChoreState(yesterdayKey, kidId, choreId)
        AND isKidsHome(yesterday)
      compliance: (not shown)
    definition: >
      The subset of yesterday's chore assignments that were not completed,
      surfaced in today's view as a carryover reminder — but only on days
      when the kids were home yesterday.
    relationships:
      - target: chore_completion_state
        type: derives_from
        cardinality: "N:1"
      - target: chore_assignment
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:1"
    relates_to:
      ui_components: [ui_chore_tracker_tab]
      elements: [chore_completion_state, chore_assignment, custody_status]

# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — REWARDS
# Elements computing and displaying reward eligibility.
# Source: chore_completion_state over rolling 7-day home-day window
# ═══════════════════════════════════════════════════════════════════════════

  - id: reward_definition
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Choose the weekend movie"
    source: localStorage["smrekar_rewards"] (array of { id, label })
    rendering:
      semantic: Reward (e.g. "Choose the weekend movie")
      systems: Reward Option
      technical: "REWARDS: {id, label}[], persisted via saveRewards()"
      compliance: (not shown)
    definition: >
      A named privilege or treat that a child earns by meeting the chore
      completion threshold over a rolling 7-day period. Fully user-managed —
      not a fixed list — via add/edit/delete in the Rewards tab.
    relationships:
      - target: ui_rewards_tab
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:1"
      - target: reward_history_entry
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      CRUD via openRewardForm()/saveReward()/deleteReward(), all persisted
      by saveRewards(). Every add/edit/delete also appends to
      reward_history_entry via logRewardChange() — this entity's current
      state and its change history are two separate, related concepts.
    relates_to:
      ui_components: [ui_rewards_tab]
      elements: [reward_eligibility, reward_history_entry]
    notes: >
      Seeded on first run by migrating the original hardcoded 7-item list
      into this stateful shape (ids seed-0..seed-6) — not re-seeded once a
      device has its own saved REWARDS state.

  - id: reward_history_entry
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Reward change history"
    source: localStorage["smrekar_rewards_history"] (append-only array)
    rendering:
      semantic: "Added \"Extra bedtime story\" — 2026-07-30"
      systems: Reward Audit Entry
      technical: "{ ts, action: 'add'|'edit'|'delete', id, label, prevLabel?, changedBy }"
      compliance: Reward Configuration Change Record
    definition: >
      One append-only log entry per add/edit/delete of a reward_definition,
      timestamped and attributed to whichever signed-in user (or "local, not
      signed in") made the change. Visible in the Rewards tab's "Show
      History" toggle, most recent first, capped to the last 25 shown.
    relationships:
      - target: reward_definition
        type: derives_from
        cardinality: "N:1"
    transformation: >
      logRewardChange(action, reward, prevLabel) appends one entry per
      saveReward()/deleteReward() call; never mutated or pruned once written.
    relates_to:
      ui_components: [ui_rewards_tab]
      elements: [reward_definition]

  - id: reward_eligibility
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    constraint:
      description: "{qualifying: integer 0–7, needed: integer, eligible: boolean, pct: decimal 0–100}"
    ui_display_name: "3 of 4 nights — 1 more night needed"
    source: chore_completion_state + parenting_home_days + system clock
    rendering:
      semantic: "3 of 4 nights — 1 more night needed" / "Reward unlocked! ⭐"
      systems: Reward Eligibility (qualifying nights / 4 threshold)
      technical: rewardEligibility(kidId, recentHomeDays(7)) → {qualifying, needed, eligible, pct}
      compliance: (not shown)
    definition: >
      Whether a child has earned a reward. Requires completing at least
      3 chores on at least 4 of the last 7 nights when the child was home.
    relationships:
      - target: chore_completion_state
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: reward_progress_bar
        type: consumed_by
        cardinality: "1:1"
      - target: ui_rewards_tab
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      recentHomeDays(7) → last 7 days when isKidsHome() was true (30-day lookback).
      qualifying = homeDays.filter(d => countDayCompleted(d.key, kidId) >= 3).length.
      pct = min(100, (qualifying / 4) * 100). eligible = qualifying >= 4.
    relates_to:
      ui_components: [reward_progress_bar, ui_rewards_tab, ui_today_chores_card]
      elements: [chore_completion_state, parenting_home_days, reward_definition]
    notes: >
      Rolling 7-day window resets naturally without admin action.
      3/4 qualifying threshold: daily set is 4 chores (3 fixed + 1 rotating),
      so 3/4 is qualifying, not perfection.

  - id: reward_progress_bar
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Progress toward reward"
    source: reward_eligibility
    rendering:
      semantic: Progress bar showing nights completed toward reward
      systems: Reward Progress Indicator
      technical: .crb-bar-fill width (pct%) in #chore-tracker-body
      compliance: (not shown)
    definition: >
      A visual burndown bar showing how many qualifying nights a child has
      completed out of 4 required for reward eligibility. Gold bar on dark background.
    relationships:
      - target: reward_eligibility
        type: derives_from
        cardinality: "N:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:1"
      - target: ui_rewards_tab
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: [ui_chore_tracker_tab, ui_rewards_tab]
      elements: [reward_eligibility]

# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — GOOGLE PHOTOS INTEGRATION
# Source: Google Photos Picker API → localStorage["smrekar_photos_meta"]
# ═══════════════════════════════════════════════════════════════════════════

  - id: google_access_token
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      format: OAuth2 Bearer (Google implicit grant, ya29.* prefix)
      description: intentionally NOT persisted to localStorage — security risk
    ui_display_name: "(not shown)"
    source: Google Sign-In (GSI) token client, implicit flow
    rendering:
      semantic: (not shown)
      systems: Google Access Token
      technical: accessToken variable (in-memory, not persisted)
      compliance: OAuth Bearer Token
    definition: >
      The short-lived OAuth 2.0 access token obtained from Google Sign-In via
      the implicit grant flow. Used as a Bearer token for Google Calendar and
      Google Photos API requests.
    relationships:
      - target: google_oauth_client_id
        type: derives_from
        cardinality: "N:1"
      - target: photo_metadata
        type: consumed_by
        cardinality: "1:N"
      - target: calendar_event
        type: consumed_by
        cardinality: "1:N"
    relates_to:
      ui_components: [ui_auth_overlay]
      elements: [google_oauth_client_id, photo_metadata, google_calendar_id]
    notes: >
      Token lifespan ~1 hour. Re-auth is lightweight — GSI caches credentials
      in the browser's Google session, usually a single click.

  - id: google_oauth_client_id
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^[0-9]+-[a-z0-9]+\\.apps\\.googleusercontent\\.com$"
      format: Google OAuth 2.0 Client ID
    ui_display_name: "(not shown)"
    source: localStorage["smrekar_hub_cfg"].clientId (user input via Settings)
    rendering:
      semantic: (not shown)
      systems: Google OAuth Client ID
      technical: CFG.clientId (string, xxxxx.apps.googleusercontent.com)
      compliance: OAuth Application Credential
    definition: >
      The Web application OAuth 2.0 client ID created in Google Cloud Console.
      Required to initialize Google Sign-In. Configured once by the administrator
      in Settings and persisted in hub_config.
    relationships:
      - target: hub_config
        type: consumed_by
        cardinality: "1:1"
      - target: google_access_token
        type: consumed_by
        cardinality: "1:1"
    relates_to:
      ui_components: [settings_panel]
      elements: [hub_config, google_access_token]
    notes: >
      Authorized JavaScript origin must include the hub's serving URL.
      Must add smrekarfamilia@gmail.com as test user while app is in Testing mode.

  - id: photo_metadata
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Selected family photos"
    source: Google Photos Picker API response + localStorage["smrekar_photos_meta"]
    rendering:
      semantic: Selected family photos
      systems: Photo Metadata Records
      technical: PHOTOS_KEY["smrekar_photos_meta"] → [{id, baseUrl, filename, mimeType}]
      compliance: (not shown)
    definition: >
      Persisted metadata for photos selected via the Google Photos Picker.
      Stores media item ID, authenticated base URL, filename, and MIME type.
      Base URL is re-fetched on sign-in to get a fresh authenticated URL.
    relationships:
      - target: google_access_token
        type: derives_from
        cardinality: "N:1"
      - target: photo_slideshow
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      browseAlbums() → picker → savePhotoMeta() → localStorage.
      Restore: restorePhotos() on sign-in → fetch baseUrl+"=w1920-h1080"
      with Bearer token → Blob URL → photo_slideshow.
      "=w1920-h1080" (no -c suffix) = fit-within-box, no crop.
    relates_to:
      ui_components: [photo_slideshow, settings_panel]
      elements: [google_access_token, photo_google_base_url]
    notes: >
      Blob URLs are in-memory only. On page reload, restorePhotos() re-fetches.
      Stale baseUrl shows "Saved photos expired — open Settings → Choose Photos…".

  - id: photo_google_base_url
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:anyURI
    constraint:
      format: "https://lh3.googleusercontent.com/..."
      description: requires Authorization header + dimension suffix; does not contain image data
    ui_display_name: "(not shown)"
    source: Google Photos API mediaItem.baseUrl
    rendering:
      semantic: (not shown)
      systems: Google Photos Base URL
      technical: mediaItem.baseUrl (authenticated CDN URL)
      compliance: (not shown)
    definition: >
      The authenticated base URL returned by Google Photos API for a media item.
      Requires appending dimension parameters and an Authorization header.
    relationships:
      - target: google_access_token
        type: depends_on
        cardinality: "N:1"
      - target: photo_metadata
        type: consumed_by
        cardinality: "1:1"
      - target: photo_slideshow
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      baseUrl+"=w1920-h1080" → fetch with Bearer token → Blob → createObjectURL()
      → CSS background-image on .photo-slide; background-size:contain.
    relates_to:
      ui_components: [photo_slideshow]
      elements: [photo_metadata, google_access_token]

  - id: photo_slideshow
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Family photo background"
