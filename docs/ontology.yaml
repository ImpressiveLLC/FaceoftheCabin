# FaceoftheCabin Platform Ontology
# ─────────────────────────────────────────────────────────────────────────────
# This file is the semantic contract for the entire platform.
# It describes every named element — hardware, infrastructure, code constructs,
# APIs, data fields, UI labels, and cross-cutting references — at the
# intersection of all platform layers.
#
# This is NOT a data model, schema, or frontend/backend spec.
# It is the authoritative definition of what things ARE, what layer they live
# on, how they relate to other elements, and how they should be rendered
# per audience context.
#
# Audiences:
#   semantic    — plain English, no jargon (Mom, casual user)
#   systems     — named concepts with values and thresholds (analyst, operator)
#   technical   — raw identifiers, types, protocols (developer, technician)
#   compliance  — audit-relevant metadata and confidence indicators (adjuster)
#
# Layer taxonomy:
#   hardware    — physical devices and their firmware identity
#   protocol    — communication standards (Zigbee, MQTT, HTTP, Tailscale)
#   integration — bridges between layers (Z2M, HA, Paho MQTT client)
#   infra       — runtime environment (Docker, Postgres, Kafka, Linux host)
#   backend     — Spring Boot application layer
#   frontend    — React UI layer / static HTML Family Hub
#   network     — connectivity fabric (LAN, Tailscale, Docker networks)
#   ontology    — this file and the semantic layer itself
#
# ─────────────────────────────────────────────────────────────────────────────
# Schema v0.3.0 — OWL/Collibra-aligned master data structure
# ─────────────────────────────────────────────────────────────────────────────
#
# Top-level per-element fields:
#   id:               canonical snake_case identifier (unique across platform)
#   entity_type:      owl:Class | owl:DatatypeProperty | owl:ObjectProperty
#   layer:            layer taxonomy value (see above)
#   primitive:        true = source value; false = derived or composite
#   schema_version:   "0.3.0" — all entries now at current schema
#   migration_status: complete
#   data_class:       raw | derived | conceptual | composite
#   data_type:        XSD primitive (xsd:string, xsd:boolean, xsd:integer,
#                     xsd:decimal, xsd:date, xsd:anyURI, xsd:hexBinary)
#                     or owl:Class for structured/composite entries
#   constraint:       optional restrictions: {maxLength, pattern, enum,
#                     format, locale, range, description}
#   primitive_type_group: groups all representations of the same semantic concept
#                     across different data types or encodings
#   ui_display_name:  literal string shown in the UI — authoritative display
#                     anchor; may repeat across entries (uniqueness =
#                     ui_display_name + data_type + id)
#   source:           origin system, API, or storage key
#   rendering:        audience-specific value rendering hints (replaces label)
#     semantic:       what Mom sees
#     systems:        what the analyst sees
#     technical:      what the developer sees
#     compliance:     what the adjuster sees
#   definition:       one-sentence plain English description
#   relationships:    structured edge list (replaces derives_from + used_by)
#     - target:       id of related element
#       type:         derives_from | consumed_by | triggers | depends_on |
#                     replaces | extends | complements | monitors | controls |
#                     notifies
#       cardinality:  1:1 | 1:N | N:1 | N:M
#   normal_range:     expected value envelope (optional, sensor readings)
#   transformation:   source→middle→target pipeline description
#   relates_to:       supplemental groupings (ui_components, elements)
#   notes:            implementation notes, constraints, known issues
# ─────────────────────────────────────────────────────────────────────────────

version: "0.3.0"
status: draft
maintainer: FaceoftheCabin platform team
last_updated: "2026-07-28"

# ═══════════════════════════════════════════════════════════════════════════
# HARDWARE ELEMENTS
# Physical devices and their immutable identity
# ═══════════════════════════════════════════════════════════════════════════

elements:

  - id: zigbee_ieee_address
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:hexBinary
    constraint:
      description: 64-bit hardware address burned at manufacture; immutable
      format: "0x{16 hex chars} (e.g. 0x00124b0014d8a1c3)"
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: IEEE Address
      technical: ieee_address (e.g. 0x00124b0014d8a1c3)
      compliance: Device Hardware ID
    definition: >
      The globally unique 64-bit hardware address burned into every Zigbee
      chip at manufacture. Immutable. The lowest-level identity of a physical
      device, independent of any pairing, naming, or software state.
    relationships:
      - target: z2m_friendly_name
        type: consumed_by
        cardinality: "1:N"
      - target: zigbee_model
        type: consumed_by
        cardinality: "1:1"
      - target: zigbee_vendor
        type: consumed_by
        cardinality: "1:1"
      - target: linkquality
        type: consumed_by
        cardinality: "1:N"
      - target: battery_percent
        type: consumed_by
        cardinality: "1:N"
      - target: temperature_celsius
        type: consumed_by
        cardinality: "1:N"
      - target: humidity_percent
        type: consumed_by
        cardinality: "1:N"
      - target: contact_state
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Never changes even if device is reset, re-paired, or renamed.
      Use as the stable foreign key when correlating across Z2M, HA, and
      FaceoftheCabin records. Not surfaced in UI except in technical view.

  - id: zigbee_model
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: manufacturer model string as reported by device firmware
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Device Model
      technical: model (e.g. SNZB-02, SNZB-04)
      compliance: Hardware Model
    definition: >
      Manufacturer model string identifying the hardware capabilities and
      firmware baseline of a Zigbee device.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_install_photo
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Used to infer device type in Zigbee2MqttAdapter.inferType().
      Also used to look up spec sheet photos from Z2M device database
      (https://github.com/Koenkk/zigbee2mqtt.io/tree/master/public/images/devices)
      as install-time thumbnail fallback when user has not taken a photo.

  - id: zigbee_vendor
    entity_type: owl:DatatypeProperty
    layer: hardware
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: manufacturer name string as reported by device firmware
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Manufacturer
      technical: vendor (e.g. SONOFF, Aqara)
      compliance: Manufacturer
    definition: Manufacturer name string as reported by the Zigbee device.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_install_photo
        type: consumed_by
        cardinality: "1:1"

# ═══════════════════════════════════════════════════════════════════════════
# PROTOCOL ELEMENTS
# Communication standards and their identifiers
# ═══════════════════════════════════════════════════════════════════════════

  - id: z2m_friendly_name
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^[a-z0-9_]+$"
      description: snake_case only; no spaces; protocol-enforced by MQTT topic parsing
    ui_display_name: "(not shown — use display_name instead)"
    rendering:
      semantic: (not shown — use display_name instead)
      systems: Z2M Friendly Name
      technical: friendly_name (e.g. door_second_contact)
      compliance: Sensor Identifier
    definition: >
      The human-assigned snake_case name for a Zigbee device as configured
      in Zigbee2MQTT. Forms the MQTT topic path and is the stable internal
      key for all Z2M operations. Must use snake_case — spaces break MQTT
      topic parsing.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: mqtt_topic
        type: consumed_by
        cardinality: "1:1"
      - target: mqtt_availability_topic
        type: consumed_by
        cardinality: "1:1"
      - target: fotc_device_id
        type: consumed_by
        cardinality: "1:1"
      - target: display_name
        type: consumed_by
        cardinality: "1:1"
    notes: >
      This is a primitive that is intentionally NOT surfaced in any UI
      audience except technical. It is the seed from which display_name
      is derived. Changing this in Z2M renames the MQTT topic and requires
      re-mapping in FaceoftheCabin device metadata.

  - id: mqtt_topic
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      pattern: "^zigbee2mqtt/[a-z0-9_]+$"
      description: constructed from Z2M topic prefix + friendly_name
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: MQTT Topic
      technical: zigbee2mqtt/{friendly_name}
      compliance: (not shown)
    definition: >
      The MQTT publish/subscribe path for a device's state messages.
      Constructed from the Z2M topic prefix and the device friendly_name.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"

  - id: mqtt_availability_topic
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^zigbee2mqtt/[a-z0-9_]+/availability$"
      description: payload is JSON {state:\"online\"} or {state:\"offline\"}
    ui_display_name: "Connection status"
    rendering:
      semantic: Connection status
      systems: Availability
      technical: zigbee2mqtt/{friendly_name}/availability
      compliance: Sensor Online Status
    definition: >
      Z2M publishes {"state":"online"} or {"state":"offline"} to this topic
      when a device joins or leaves the Zigbee mesh. This is the authoritative
      online/offline signal — more reliable than inferring from data messages.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:1"
    notes: >
      FaceoftheCabin uses this as the primary state signal. Data message
      arrival (linkquality present) is a secondary signal. See
      Zigbee2MqttAdapter.handleAvailability().

# ═══════════════════════════════════════════════════════════════════════════
# INTEGRATION ELEMENTS
# Bridges between layers
# ═══════════════════════════════════════════════════════════════════════════

  - id: fotc_device_id
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      pattern: "^z2m-[a-z0-9_]+$"
      description: integration-source prefix namespaces across multiple adapters
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Device ID
      technical: z2m-{friendly_name} (e.g. z2m-door_second_contact)
      compliance: Platform Device ID
    definition: >
      FaceoftheCabin's internal stable identifier for a device. Prefixed
      with the integration source (z2m-, home-, etc.) to namespace across
      multiple integration adapters.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"
      - target: device_command
        type: consumed_by
        cardinality: "1:N"
      - target: display_name
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Never shown in semantic or systems UI. Technical and compliance views
      show it alongside display_name for cross-reference.

  - id: display_name
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      maxLength: 100
      description: user-defined; UI falls back to cleaned z2m_friendly_name if absent
    ui_display_name: "Back Door Sensor"
    rendering:
      semantic: Device name (e.g. "Back Door Sensor")
      systems: Display Name
      technical: displayName (device metadata table)
      compliance: Sensor Label
    definition: >
      The human-readable name for a device as set by the user at install
      time or via the settings panel. Completely independent of z2m_friendly_name.
      This is what every non-technical audience sees everywhere in the platform.
    relationships:
      - target: z2m_friendly_name
        type: derives_from
        cardinality: "N:1"
      - target: fotc_device_id
        type: depends_on
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Stored in device metadata table in Postgres. Seeded at first discovery
      with a cleaned version of friendly_name (underscores to spaces, title
      case) as a prompt default. User can override at any time.
      If not set, UI falls back to cleaned friendly_name — never raw snake_case.

  - id: device_room
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      maxLength: 80
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_room)"
      description: >
        User structured selection from a curated room-name list. Values outside
        the master list trigger a candidate_term_submission automatically.
    ui_display_name: "Kitchen"
    rendering:
      semantic: Room (e.g. "Kitchen", "Back Porch")
      systems: Room / Zone (L1 — room-level location)
      technical: room (device metadata table, snake_case; L1 of location_context)
      compliance: Installation Location (L1)
    definition: >
      The room-level (L1) location of a device within the installation site.
      User selects from a curated soft-enum list. Custom values auto-submit a
      candidate_term_submission for master vocabulary review.
    relationships:
      - target: display_name
        type: depends_on
        cardinality: "N:1"
      - target: device_location_zone
        type: consumed_by
        cardinality: "1:N"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"

  - id: device_install_photo
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:anyURI
    constraint:
      description: URL to user photo, Z2M spec image, or generic icon; fallback hierarchy applied
    ui_display_name: "Photo"
    rendering:
      semantic: Photo
      systems: Install Photo
      technical: photoUrl (device metadata table)
      compliance: Installation Evidence
    definition: >
      Photo taken at device install time showing the physical device and its
      location. Used as tile background or thumbnail. Serves as visual memory
      aid for all audiences and installation evidence for compliance.
    relationships:
      - target: zigbee_model
        type: derives_from
        cardinality: "N:1"
      - target: zigbee_vendor
        type: derives_from
        cardinality: "N:1"
    notes: >
      Fallback hierarchy: user photo → Z2M device database spec image
      (keyed by zigbee_model) → generic device type icon.
      Prompted once at first device discovery. Stored as URL (local or CDN).

# ═══════════════════════════════════════════════════════════════════════════
# LOCATION CONTEXT ELEMENTS
# Structured multi-level location identity for every installed device.
# Primitive type group: device_location (L1–L3 + derived formatted output)
# Vocabulary feedback: custom values auto-submit candidate_term_submission
# ═══════════════════════════════════════════════════════════════════════════

  - id: location_context
    entity_type: owl:Class
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    primitive_type_group: device_location
    ui_display_name: "Location"
    rendering:
      semantic: Where this device is installed
      systems: Location Context (L1 · L2a · L2b · L3 · formatted)
      technical: >
        location_context aggregate: {device_room, device_location_zone,
        device_location_qualifier, device_location_text, device_location_formatted}
      compliance: Physical Installation Address
    definition: >
      The aggregate location identity for an installed device. Groups the full
      five-level location attribute set (L1 room, L2a zone, L2b qualifier, L3
      free text, derived formatted string) under one class so automations,
      device naming pipelines, and UI surfaces can resolve any representation
      from a single context reference.
    relationships:
      - target: device_room
        type: extends
        cardinality: "1:1"
      - target: device_location_zone
        type: extends
        cardinality: "1:1"
      - target: device_location_qualifier
        type: extends
        cardinality: "1:1"
      - target: device_location_text
        type: extends
        cardinality: "1:1"
      - target: device_location_formatted
        type: extends
        cardinality: "1:1"
    notes: >
      This class does not store data — it is a semantic grouping and the
      resolution entry point for location-aware automations and naming pipelines.
      All five member properties share primitive_type_group: device_location.

  - id: device_location_zone
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_location_zone)"
      description: >
        Sub-room zone within device_room (L2a). User selects from curated list
        per room type. Values not in master list auto-submit candidate_term_submission
        with alert to user. Examples: "Floor", "Wall", "Ceiling", "Under sink",
        "Breaker box area", "Counter", "Cabinet", "Window sill"
    ui_display_name: "Zone within room"
    rendering:
      semantic: Area within the room (e.g. "Near the breaker box", "Under the sink")
      systems: Location Zone (L2a — sub-room zone)
      technical: location_zone (device metadata table; L2a of location_context)
      compliance: Installation Zone
    definition: >
      The zone-level (L2a) sub-room location of a device. A structured
      selection from a curated soft-enum vocabulary scoped to the parent
      device_room. Custom values trigger a vocabulary candidacy submission
      and user alert, and are excluded from automation logic until promoted.
    relationships:
      - target: device_room
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: consumed_by
        cardinality: "1:N"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: candidate_term_submission
        type: triggers
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Soft enum: the UI presents a dropdown of master terms for the selected
      device_room. "Other — describe it" option opens a free-text field and
      submits candidate_term_submission on save. Custom values are stored but
      flagged as non-master; automations that reference device_location_zone
      by value will not match a custom value until it is promoted to master.

  - id: device_location_qualifier
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      vocabulary: soft_enum
      vocabulary_source: "location_vocabulary_term (applies_to: device_location_qualifier)"
      description: >
        Positional descriptor within device_location_zone (L2b). User selects
        from curated list per zone type. Examples: "North wall", "South wall",
        "Left side", "Right side", "Above drain", "Eye level", "Floor level",
        "Port 1", "Port 2". Custom values auto-submit candidate_term_submission.
    ui_display_name: "Position within zone"
    rendering:
      semantic: Exact position (e.g. "North wall, about 4 feet up")
      systems: Location Qualifier (L2b — positional within zone)
      technical: location_qualifier (device metadata table; L2b of location_context)
      compliance: Installation Qualifier
    definition: >
      The positional (L2b) descriptor within a zone. Answers "where exactly
      within the zone." Soft enum scoped to parent device_location_zone.
      Custom values trigger candidacy submission and user alert.
    relationships:
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_formatted
        type: consumed_by
        cardinality: "1:N"
      - target: candidate_term_submission
        type: triggers
        cardinality: "1:N"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Same soft-enum + candidacy pattern as device_location_zone. Both L2a and
      L2b custom values submit separate candidate_term_submission records with
      distinct applies_to context so the review queue can distinguish them.

  - id: device_location_text
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      maxLength: 500
      description: >
        Free text narrative (L3). Annotation only — excluded from all automation
        logic and device naming derivations. Shown to semantic and compliance
        audiences only.
    ui_display_name: "Description"
    rendering:
      semantic: Description (e.g. "On the north wall next to the breaker box, about 4 feet up")
      systems: Location Narrative (L3 — free text annotation)
      technical: location_text (device metadata table; L3 of location_context; unstructured)
      compliance: Installation Description
    definition: >
      A free-text narrative description of the device's physical location.
      Intended for human readability (semantic and compliance audiences) only.
      Not used in automation rules, device naming, or any derived computation.
      The semantic audience fallback when L1+L2 structured context is insufficient.
    relationships:
      - target: device_location_qualifier
        type: depends_on
        cardinality: "N:1"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    notes: >
      L3 does NOT feed candidate_term_submission — it is deliberately unstructured
      and is not a vocabulary candidate. If the user's L3 text suggests a new
      structured concept, the reviewer promotes it by adding a master term to
      location_vocabulary_term and linking it to L2a or L2b.

  - id: device_location_formatted
    entity_type: owl:DatatypeProperty
    layer: integration
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    primitive_type_group: device_location
    constraint:
      description: >
        System-generated; never user-entered. Multiple format variants produced
        from the same L1+L2 source: snake_case (MQTT/Z2M), camelCase (JSON keys),
        PascalCase (HA entity IDs), Title Case (display labels). Only master-list
        L1 and L2 values are included; custom/candidate values are excluded until
        promoted.
    ui_display_name: "(system generated)"
    rendering:
      semantic: (not shown — system internal)
      systems: Formatted Location String (protocol-safe variants)
      technical: >
        location_formatted_{variant} (device metadata table):
        snake_case → "basement_mech_room_north_wall"
        camelCase  → "basementMechRoomNorthWall"
        PascalCase → "BasementMechRoomNorthWall"
        label      → "Basement · Mech Room · North Wall"
      compliance: (not shown)
    definition: >
      Protocol-safe location strings derived from device_room (L1),
      device_location_zone (L2a), and device_location_qualifier (L2b).
      Generated in multiple format variants to satisfy naming constraints across
      MQTT topics, HA entity IDs, Z2M friendly_name seeds, and UI display labels.
      Eliminates all manual format entry for device orchestration pipelines.
    relationships:
      - target: device_room
        type: derives_from
        cardinality: "N:1"
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: derives_from
        cardinality: "N:1"
      - target: z2m_friendly_name
        type: consumed_by
        cardinality: "1:1"
      - target: fotc_device_id
        type: consumed_by
        cardinality: "1:1"
      - target: location_context
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      Source: device_room.value + device_location_zone.value +
              device_location_qualifier.value (master-list values only).
      Middle: normalize each segment → lowercase, strip punctuation, replace
              spaces with underscores → join with _ for snake_case.
              camelCase: capitalize each segment after first, join.
              PascalCase: capitalize all segments, join.
              label: Title Case segments joined with " · ".
      Target: stored as location_formatted_{variant} columns in device metadata table.
      Regenerated: on any L1/L2 change, on vocabulary term promotion.
    notes: >
      Custom (non-master) L1/L2 values are excluded from formatted output —
      the pipeline produces an empty/partial string and raises a UI warning
      ("Location not fully standardized — formatted name unavailable until
      reviewed terms are approved"). This is intentional: it prevents
      non-standard strings from entering MQTT topics or HA entity IDs.

  - id: location_vocabulary_term
    entity_type: owl:Class
    layer: ontology
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Location vocabulary term"
    rendering:
      semantic: (not shown — admin only)
      systems: Location Vocabulary Term
      technical: >
        location_vocabulary_term table: {id, value, applies_to,
        parent_room_types[], status, usage_count, source}
      compliance: Master Data Term Record
    definition: >
      A single entry in the master controlled vocabulary for location attributes.
      Shared by all three location soft-enum properties (device_room, L2a, L2b).
      Each term is scoped to one or more room types via parent_room_types, or
      global (applies to all rooms). Terms have a lifecycle: candidate → master
      → deprecated.
    relationships:
      - target: device_room
        type: controls
        cardinality: "1:N"
      - target: device_location_zone
        type: controls
        cardinality: "1:N"
      - target: device_location_qualifier
        type: controls
        cardinality: "1:N"
      - target: candidate_term_submission
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Fields per term:
        id:               snake_case canonical ID
        value:            display string (e.g. "Breaker box area")
        applies_to:       device_room | device_location_zone | device_location_qualifier
        parent_room_types: [] (empty = global; ["basement"] = basement only)
        status:           master | candidate | deprecated
        usage_count:      integer — computed from device metadata records
        source:           system | user_submission
      Deprecated terms remain in the table for historical device records.
      Master terms are included in the UI dropdown. Candidates are queued
      for review but not yet shown in the dropdown.

  - id: candidate_term_submission
    entity_type: owl:Class
    layer: ontology
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Candidate vocabulary term"
    rendering:
      semantic: (not shown — admin only)
      systems: Candidate Term Submission
      technical: >
        candidate_term_submission record: {id, term_value, applies_to,
        context_device_id, context_room, submitted_at, review_status,
        approved_as_term_id, submission_count}
      compliance: Vocabulary Candidacy Record
    definition: >
      A record created automatically whenever a user enters a value not present
      in the master location_vocabulary_term list for any soft-enum location
      attribute. Queued for manual review; eventually automated promotion based
      on submission frequency and semantic similarity to existing terms.
    relationships:
      - target: device_location_zone
        type: derives_from
        cardinality: "N:1"
      - target: device_location_qualifier
        type: derives_from
        cardinality: "N:1"
      - target: location_vocabulary_term
        type: consumed_by
        cardinality: "N:1"
    transformation: >
      Trigger: user enters custom value in any soft-enum location field + saves.
      Source: {term_value, applies_to (L2a or L2b), context_device_id,
               context_room (device_room.value), submitted_at: now()}.
      Middle: check existing submissions — if term_value+applies_to already
              exists as candidate, increment submission_count only (no duplicate).
              If new, create record with review_status: pending.
      Alert: UI displays inline notice: "'{value}' isn't in our standard list.
             It's been submitted for review — if approved, it'll appear in the
             dropdown for all users."
      Review queue: admin sees pending submissions ranked by submission_count desc.
      Promotion: admin (or eventually: auto-promote at submission_count >= threshold)
              sets review_status: approved, creates location_vocabulary_term with
              status: master, source: user_submission. approved_as_term_id links back.
      Rejection: review_status: rejected; term remains stored on the device record
              but excluded from formatting pipeline and future dropdowns.
    notes: >
      submission_count deduplication: same term_value + applies_to across different
      devices increments the count on one record (not N records). This makes the
      review queue a ranked frequency list, not a flood of duplicates.
      Automation candidacy: a term with review_status: candidate is NOT available
      as an automation trigger value — only master terms qualify. This is enforced
      at the automation rule editor layer.
      Future: NLP/embedding similarity check on submission to flag near-duplicates
      of existing master terms before creating a new candidate record (e.g.
      "mech room" vs "mechanical room" → suggest existing term, ask user to confirm).

# ═══════════════════════════════════════════════════════════════════════════
# DEVICE STATE ELEMENTS
# Runtime readings and their semantic definitions
# ═══════════════════════════════════════════════════════════════════════════

  - id: device_state
    entity_type: owl:DatatypeProperty
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      enum: [ONLINE, OFFLINE, UNKNOWN, ALARM]
      description: UNKNOWN is transient — resolves within 5 min of backend start
    ui_display_name: "Online"
    rendering:
      semantic: Status (Online / Offline / Alert)
      systems: Device State (ONLINE / OFFLINE / UNKNOWN / ALARM)
      technical: state field on DeviceStatus
      compliance: Operational Status
    definition: >
      The current operational state of a device. Derived from Z2M availability
      topic (primary) and data message presence (secondary). UNKNOWN means
      the platform has not yet received a state signal since last restart.
    relationships:
      - target: mqtt_availability_topic
        type: derives_from
        cardinality: "N:1"
      - target: linkquality
        type: derives_from
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      UNKNOWN is a transient state, not a stable one. If a device stays
      UNKNOWN for >5 minutes after backend start, treat as a connectivity
      issue. See QA check: devices-z2m.

  - id: linkquality
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:integer
    constraint:
      range:
        min: 0
        max: 255
      description: Zigbee LQI — higher is better; >= 150 is good
    ui_display_name: "Signal"
    rendering:
      semantic: Signal (● ● ● / ● ● ○ / ● ○ ○)
      systems: Link Quality (0–255 LQI)
      technical: linkquality attribute (Zigbee LQI)
      compliance: Signal Confidence
    definition: >
      Zigbee Link Quality Indicator. A 0–255 integer representing the RF
      signal quality between a device and its nearest mesh router or
      coordinator. Higher is better.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: consumed_by
        cardinality: "1:N"
    normal_range:
      good: ">= 150"
      fair: "100–149"
      poor: "< 100"
    notes: >
      Rendered as dots or bars in semantic view. Shown as numeric LQI in
      technical view. Used as secondary online signal — presence of linkquality
      in a data message confirms device is transmitting.

  - id: battery_percent
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:integer
    constraint:
      range:
        min: 0
        max: 100
      description: absent attribute must not be treated as 0% — device may not report battery
    ui_display_name: "Battery"
    rendering:
      semantic: Battery (e.g. "Battery low — replace soon")
      systems: Battery (%)
      technical: battery attribute (0–100)
      compliance: Power Source Status
    definition: >
      Remaining battery level as reported by the device, expressed as a
      percentage of full charge.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    normal_range:
      ok: ">= 20"
      warn: "10–19"
      critical: "< 10"
    notes: >
      Warn threshold (20%) should proactively surface on tile badge without
      requiring drill-down. Critical threshold (10%) triggers a notification.
      Not all devices report battery — absence of battery attribute should
      not be treated as 0%.

  - id: temperature_celsius
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:decimal
    constraint:
      range:
        min: -40
        max: 85
      description: reported in Celsius by Z2M; UI renders °F by default for US users
    ui_display_name: "Temperature"
    rendering:
      semantic: Temperature (e.g. "Comfortable — 72°F")
      systems: Temperature (°C / °F)
      technical: temperature attribute (float, Celsius)
      compliance: Environmental Reading
    definition: >
      Ambient temperature reading from a Zigbee temperature sensor,
      reported in degrees Celsius by Z2M.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
    normal_range:
      freeze_risk: "< 3.3"    # 38°F
      cold: "3.3–15.5"
      comfortable: "15.5–26.6"
      warm: "26.6–35"
      hot: "> 35"
    notes: >
      Stored and transmitted in Celsius. UI renders in °F by default for
      US users with semantic bracket label. Technical view shows raw °C.
      Freeze risk threshold (3.3°C / 38°F) triggers alert regardless of
      user role — safety-class reading.

  - id: humidity_percent
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:decimal
    constraint:
      range:
        min: 0
        max: 100
      description: percent relative humidity (%RH); >75% sustained is mold risk
    ui_display_name: "Humidity"
    rendering:
      semantic: Humidity (e.g. "Comfortable — 45%")
      systems: Relative Humidity (%)
      technical: humidity attribute (float, %RH)
      compliance: Environmental Reading
    definition: >
      Relative humidity reading from a Zigbee humidity sensor, expressed
      as a percentage of saturation.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
    normal_range:
      dry: "< 30"
      comfortable: "30–60"
      humid: "60–75"
      mold_risk: "> 75"
    notes: >
      Mold risk threshold (>75% sustained) is a compliance-class alert.
      A leak sensor showing >90% humidity sustained for >30 minutes should
      trigger a water event alert regardless of contact sensor state.

  - id: contact_state
    entity_type: owl:DatatypeProperty
    layer: protocol
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:boolean
    constraint:
      description: true = closed (safe); false = open (notable); polarity is not inverted
    ui_display_name: "Open / Closed"
    rendering:
      semantic: Open / Closed
      systems: Contact (true=closed, false=open)
      technical: contact attribute (boolean)
      compliance: Entry Point Status
    definition: >
      Boolean state of a contact sensor — true when the magnetic contact
      is closed (door/window shut), false when open.
    relationships:
      - target: zigbee_ieee_address
        type: derives_from
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
    notes: >
      Polarity is: true=closed=safe, false=open=notable.
      Semantic rendering: true → "Closed ✓", false → "Open".
      Compliance view includes timestamp of last state change.

# ═══════════════════════════════════════════════════════════════════════════
# INFRASTRUCTURE ELEMENTS
# Runtime environment identifiers
# ═══════════════════════════════════════════════════════════════════════════

  - id: tailscale_ip
    entity_type: owl:DatatypeProperty
    layer: network
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      pattern: "^100\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}$"
      description: stable per-machine but not globally fixed; store in env vars, not committed files
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Tailscale IP
      technical: 100.x.x.x (Tailscale MagicDNS IP)
      compliance: Remote Access Address
    definition: >
      The stable private IP address assigned to a machine within the
      Tailscale mesh VPN. Used for cross-machine service access without
      exposing services to the public internet.
    relationships:
      - target: machine_hostname
        type: depends_on
        cardinality: "N:1"
    notes: >
      cabin hub (M920q): 100.77.44.113
      ilikethelights (dev): detected at runtime via tailscale status
      These IPs are stable per-machine but not globally fixed. Do not
      hardcode in committed files — use env vars or machine profiles.

  - id: docker_network_cabin_default
    entity_type: owl:DatatypeProperty
    layer: infra
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: Docker bridge network name; must match external_links network_mode in compose
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Cabin Docker Network
      technical: cabin_default (Docker bridge network)
      compliance: (not shown)
    definition: >
      The Docker bridge network shared by all containers in the existing
      cabin stack (mosquitto, homeassistant, nodered, frigate, zigbee2mqtt,
      homepage, uptime-kuma, mediamtx). FaceoftheCabin's cabin-backend
      joins this network to reach mosquitto by container name.
    relationships:
      - target: machine_hostname
        type: depends_on
        cardinality: "N:1"
    notes: >
      Network name discovered during M920q deployment — was incorrectly
      assumed to be mosquitto_default in early overlay config. Correct
      name is cabin_default. See docker-compose.m920q.yml.

  - id: machine_hostname
    entity_type: owl:DatatypeProperty
    layer: infra
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: OS hostname as returned by platform.node(); add new machines to _MACHINES dict
    ui_display_name: "(not shown)"
    rendering:
      semantic: (not shown)
      systems: Machine Name
      technical: platform.node() hostname
      compliance: Asset Identifier
    definition: >
      The OS hostname of a machine running FaceoftheCabin components.
      Used by the QA runner to auto-detect machine profile and apply
      the correct test suite and environment assumptions.
    relationships:
      - target: tailscale_ip
        type: consumed_by
        cardinality: "1:1"
      - target: docker_network_cabin_default
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Known machines:
        ilikethelights — Windows dev machine, Minneapolis
        nates-little-m920q — Linux cabin hub, M920q hardware
      Unknown hostnames get a best-effort profile. Add new machines to
      qa/cabin_qa.py _MACHINES dict when they become regular access points.

# ═══════════════════════════════════════════════════════════════════════════
# ACTION ELEMENTS
# Controllable behaviors and their constraints
# ═══════════════════════════════════════════════════════════════════════════

  - id: device_command
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    constraint:
      description: "{command: string, payload: object}; must route through HA adapter, not direct Z2M"
    ui_display_name: "Sound alarm"
    rendering:
      semantic: Action (e.g. "Sound alarm", "Lock door")
      systems: Device Command
      technical: POST /api/devices/{deviceId}/command {command, payload}
      compliance: Recorded Action
    definition: >
      A user-initiated instruction sent to a physical device via the
      FaceoftheCabin backend, routed through Home Assistant for execution,
      logging, and automation awareness.
    relationships:
      - target: fotc_device_id
        type: depends_on
        cardinality: "N:1"
      - target: audit_log
        type: consumed_by
        cardinality: "1:N"
      - target: action_confirmation_copy
        type: consumed_by
        cardinality: "1:1"
    notes: >
      All commands route through HA adapter — not direct Z2M MQTT.
      This ensures HA automations are aware of manual commands and can
      respond (e.g. don't re-trigger alarm if user just silenced it).
      Every command execution is written to audit_log with timestamp,
      user context, command, payload, and HA response status.

  - id: action_confirmation_copy
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:string
    constraint:
      description: required for all irreversible, safety-relevant, or liability-class actions
    ui_display_name: "Confirmation message"
    rendering:
      semantic: Confirmation message before irreversible action
      systems: Confirmation Dialog
      technical: confirmation prop on ActionButton component
      compliance: Required pre-action disclosure
    definition: >
      Plain-language consequence description shown to the user before any
      action that is irreversible, safety-relevant, or has liability
      implications. Required for: silence alarm, bypass sensor, unlock door.
    relationships:
      - target: device_command
        type: derives_from
        cardinality: "N:1"
    notes: >
      Examples:
        Silence leak alarm: "Silencing this alarm means water damage may
        go undetected. The sensor will not alert again until re-armed."
        Unlock door: "This will unlock the front door remotely. Confirm
        you intend to grant access."
      Must be present on all destructive/safety actions. Non-negotiable
      per adjuster feedback from user test group session 2026-07-26.

  - id: audit_log
    entity_type: owl:Class
    layer: backend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    constraint:
      description: append-only; no update or delete permitted; immutable record
    ui_display_name: "Activity history"
    rendering:
      semantic: Activity history
      systems: Audit Log
      technical: device_audit_log table (Postgres)
      compliance: Action Evidence Record
    definition: >
      Append-only timestamped record of every device command, alert trigger,
      sensor state change, and system event. The compliance and liability
      record of platform activity.
    relationships:
      - target: device_command
        type: derives_from
        cardinality: "N:1"
      - target: device_state
        type: derives_from
        cardinality: "N:1"
    notes: >
      Promoted from Phase 2 to core requirement per adjuster and analyst
      feedback (user test group session 2026-07-26). Must be present when
      device command endpoint ships. Immutable — no delete or update,
      append only.

# ═══════════════════════════════════════════════════════════════════════════
# ONTOLOGY META-ELEMENTS
# Elements that describe the ontology itself
# ═══════════════════════════════════════════════════════════════════════════

  - id: semantic_layer_toggle
    entity_type: owl:DatatypeProperty
    layer: ontology
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      enum: [semantic, systems, technical, compliance]
      description: default = semantic for new users; toggle is additive, not a filter
    ui_display_name: "View: Simple / Detailed / Technical"
    rendering:
      semantic: "View: Simple / Detailed / Technical"
      systems: Audience Context Toggle
      technical: roleContext (localStorage, semantic|systems|technical|compliance)
      compliance: (not shown)
    definition: >
      User preference controlling how all data elements are rendered across
      the platform. Persisted in localStorage. Determines which label
      and which attributes are visible for every element in every view.
    relationships:
      - target: data_dictionary_ui
        type: consumed_by
        cardinality: "1:1"
    notes: >
      Default: semantic (plain English) for new users.
      The toggle is additive — technical view shows everything semantic
      and systems show, plus raw identifiers. It is not a filter that
      hides useful information; it is a progressive disclosure mechanism.

  - id: data_dictionary_ui
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Help — What does this mean?"
    rendering:
      semantic: Help — What does this mean?
      systems: Data Dictionary
      technical: /settings/dictionary route
      compliance: Terminology Reference
    definition: >
      Searchable, filterable reference of all platform elements rendered
      per the current audience context. Sourced from this ontology file.
      Accessible from the detail sheet ("What is linkquality?") and from
      the settings panel.
    relationships:
      - target: semantic_layer_toggle
        type: depends_on
        cardinality: "N:1"
    notes: >
      The data dictionary UI is the last thing built — it is powered by
      the same element definitions that drive the rendering layer.
      Building the rendering layer first (formatAttribute utility) means
      the dictionary is a display view of already-existing structured data,
      not a separately maintained document.

# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — IDENTITY & CONFIGURATION
# Elements that define who the hub belongs to and how it is configured.
# Source: localStorage key "smrekar_hub_cfg" (CFG object in family-hub.html)
# ═══════════════════════════════════════════════════════════════════════════

  - id: hub_family_name
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      maxLength: 100
      pattern: "^[A-Za-z\\s'-]+$"
    ui_display_name: "Smrekar"
    source: localStorage["smrekar_hub_cfg"].familyName (user input)
    rendering:
      semantic: Family name (e.g. "Smrekar")
      systems: Configured Family Name
      technical: CFG.familyName (string)
      compliance: Hub Owner Name
    definition: >
      The family name entered by the administrator in Settings. Drives all
      personalized text across the Family Hub — greeting, brand block, and
      custody status messages. Template variable enabling reuse across
      different family units without code changes.
    relationships:
      - target: hub_config
        type: consumed_by
        cardinality: "1:1"
      - target: hub_brand_block
        type: consumed_by
        cardinality: "1:1"
      - target: custody_status_card
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      User types name in Settings → saved as CFG.familyName →
      updateGreeting() + updateBrand() propagate on every save and page load.
    relates_to:
      ui_components: [hub_brand_block, custody_status_card]
      elements: [hub_config]
    notes: >
      Stored under localStorage key "smrekar_hub_cfg". Default seeded as
      "Smrekar" in the Smrekar instance. Any other family deploying this
      template sets this once in Settings and every personalized string
      updates automatically. No code changes required for a new deployment.

  - id: hub_config
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "App settings"
    source: localStorage["smrekar_hub_cfg"] (JSON object)
    rendering:
      semantic: App settings
      systems: Hub Configuration
      technical: CFG object (smrekar_hub_cfg localStorage key)
      compliance: Configuration Record
    definition: >
      The persisted configuration object for the Family Hub. Stores all
      admin-entered settings including family name, Google OAuth client ID,
      calendar ID, slideshow interval, and max photos. Loaded at startup,
      saved on Settings → Save.
    relationships:
      - target: hub_family_name
        type: derives_from
        cardinality: "1:1"
      - target: google_oauth_client_id
        type: derives_from
        cardinality: "1:1"
      - target: google_calendar_id
        type: derives_from
        cardinality: "1:1"
      - target: hub_brand_block
        type: consumed_by
        cardinality: "1:1"
      - target: photo_slideshow
        type: consumed_by
        cardinality: "1:1"
      - target: settings_panel
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      Admin fills settings panel fields → saveSettings() serializes to JSON →
      localStorage.setItem("smrekar_hub_cfg", JSON.stringify(CFG)).
      On load: JSON.parse(localStorage.getItem("smrekar_hub_cfg")) merged
      with DEFAULTS object to fill any missing keys.
    relates_to:
      ui_components: [settings_panel]
      elements: [hub_family_name, google_oauth_client_id, google_calendar_id]
    notes: >
      DEFAULTS object in code provides fallback values for all keys.
      Calendar ID stored as extracted email (normalizeCalendarId strips
      embed URLs and iframe src to just the email address).

  - id: hub_brand_block
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Smrekar Family Hub"
    source: hub_family_name + hodgson-crest.svg (static asset)
    rendering:
      semantic: Family Hub logo and name
      systems: Brand Block
      technical: "#hub-brand div (top-bar, position:absolute top-left)"
      compliance: (not shown)
    definition: >
      The visual identity element in the upper-left of the Family Hub display.
      Comprises the Hodgson family crest SVG (78px) and the family name
      ("Smrekar") above the subtitle "Family Hub" in gold. Driven by
      hub_family_name so each family deployment shows their own name.
    relationships:
      - target: hub_family_name
        type: derives_from
        cardinality: "N:1"
      - target: ui_top_bar
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      hub_family_name → updateBrand() sets #brand-family textContent.
      SVG asset is static. Font and color driven by CSS vars (--font-display,
      --gold). Called on page load, every minute via updateGreeting(), and
      immediately on Settings save.
    relates_to:
      ui_components: [ui_top_bar]
      elements: [hub_family_name, hub_config]
    notes: >
      SVG: family-hub/hodgson-crest.svg — three spruce trees after the
      Hodgson family headstone carving. Gold stroke #C8A44A.
      Logo width: 78px (50% larger than the original 52px ambient-crest).
      Only the text is dynamic; the SVG is fixed per deployment.

  - id: family_profile
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Family member"
    source: localStorage["family_profiles"] (JSON array)
    rendering:
      semantic: Family member
      systems: Family Profile
      technical: profile object {id, name, role, age, avatar, color} in PROFILES_KEY
      compliance: (not shown)
    definition: >
      A record representing one family member (parent, child, or pet).
      Defines the individual's role, display name, avatar emoji, age (for
      chore eligibility), and accent color. Used to personalize chores,
      rewards, and schedule displays.
    relationships:
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Admin enters profile in Family Profiles tab → saveProfiles() writes
      JSON array to localStorage["family_profiles"].
      getKids() filters role === 'kid', getParents() filters role === 'parent',
      getPets() filters role === 'pet'.
    relates_to:
      ui_components: [ui_profiles_tab, ui_chore_kid_selector, ui_overview_tab, current_actor]
      elements: [chore_assignment, reward_eligibility, hub_config, current_actor]
    notes: >
      DEFAULT_PROFILES seeds Sam (kid, 11), Emma (kid, 9), Frankie (pet),
      Nathan (parent). Age field determines chore_assignment eligibility via
      choresByAge(). Profiles are fully configurable — no hardcoded names
      in rendering logic.

  - id: current_actor
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: family_profile id with role kid or parent; never pet
    ui_display_name: "Who are you?"
    source: sessionStorage["smrekar_current_actor"] ({ id, lastActivity })
    rendering:
      semantic: "Viewing as: Sam"
      systems: Actor Context (id + last-activity timestamp)
      technical: "currentActorId; ACTOR_KEY sessionStorage entry"
      compliance: (not shown — explicitly not an access-control identity)
    definition: >
      Which family_profile the current browser tab is "speaking/acting as."
      Set once at Dashboard > Overview, then used as the shared default for
      every feature that previously had its own separate, narrower "who is
      this for" selector (notepad author, chore tracker's kid selector) —
      those still allow a local one-off override, they just start from this
      value now instead of an arbitrary first-profile default. Explicitly
      NOT authentication or access control: any profile can be picked by
      anyone, same trust model as a shared paper family calendar — the
      point is reducing misattribution (a note posted as the wrong kid), not
      restricting who can do what.
    relationships:
      - target: family_profile
        type: depends_on
        cardinality: "N:1"
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      setCurrentActor(id) writes { id, lastActivity: Date.now() } to
      sessionStorage and propagates to selectedNoteAuthorId /
      activeChoreKid. touchActorActivity() refreshes lastActivity on any
      click/touch inside #dashboard-overlay. checkActorTimeout() runs every
      30s; if 5 minutes have passed since lastActivity, clears the actor
      and (if the Dashboard is open) closes it back to the ambient Home
      view — renderActorPicker() then shows the "Who are you?" prompt again
      on next entry to Overview.
    relates_to:
      ui_components: [ui_overview_tab, ui_notepad, ui_chore_kid_selector]
      elements: [family_profile]
    notes: >
      sessionStorage, not localStorage, deliberately — should not survive
      closing and reopening the browser on someone's personal phone, but
      should survive an accidental same-tab reload on the always-on kiosk
      display (the 5-minute idle timer is the real reset mechanism there,
      not the tab/session boundary). Added 2026-07-31 in response to a
      real, verified bug: the Dashboard's 5-tab row (#dash-tabs) had no
      overflow handling, so the "Family" tab — the existing profile
      add/edit/delete CRUD the user was looking for — could be pushed
      fully off-screen and unreachable on a narrow phone. Fixed alongside
      this feature (scrollable tab row, hidden scrollbar, same pattern used
      elsewhere in this file) since it directly blocked reaching the
      current_actor candidate list's source of truth.

# ═══════════════════════════════════════════════════════════════════════════
# FAMILY HUB — PARENTING SCHEDULE
# Elements defining and computing the 14-day custody cycle.
# Source: localStorage["smrekar_schedule_cfg"] + hardcoded default anchor
# ═══════════════════════════════════════════════════════════════════════════

  - id: parenting_schedule_anchor
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:date
    constraint:
      format: ISO 8601 (YYYY-MM-DD)
    ui_display_name: "Schedule start date"
    source: localStorage["smrekar_schedule_cfg"].start (ISO date string)
    rendering:
      semantic: Schedule start date
      systems: Custody Cycle Anchor Date
      technical: SCHEDULE_START (Date object, loaded from smrekar_schedule_cfg.start)
      compliance: Custody Agreement Reference Date
    definition: >
      The reference date marking day 0 of the 14-day parenting custody cycle.
      All custody calculations count forward from this anchor using modular
      arithmetic on the day difference. Configurable in Settings.
    relationships:
      - target: parenting_home_days
        type: consumed_by
        cardinality: "1:1"
      - target: custody_status
        type: consumed_by
        cardinality: "1:N"
      - target: chore_assignment
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      User enters date in Settings → saveSettings() calls saveSchedCfg() →
      localStorage["smrekar_schedule_cfg"] = {start, homeDays}.
      On load: SCHEDULE_START = new Date(s.start + 'T12:00:00').
      Default: 2026-03-13 (a Friday, day 0 of the Smrekar schedule).
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab]
      elements: [parenting_home_days, custody_status]
    notes: >
      Set to noon (T12:00:00) to avoid daylight-saving boundary edge cases.
      The default anchor (2026-03-13) is the Smrekar family's agreed reference
      date and should not be changed unless the custody agreement changes.

  - id: parenting_home_days
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      description: JSON-serialized integer array; values in range [0,13]
      pattern: "^\\[([0-9]|1[0-3])(,([0-9]|1[0-3]))*\\]$"
    primitive_type_group: parenting_home_days
    ui_display_name: "Nights at Dad's"
    source: localStorage["smrekar_schedule_cfg"].homeDays (array of integers 0–13)
    rendering:
      semantic: "Nights at Dad's"
      systems: Kids-Home Day Indices
      technical: KIDS_HOME_DAYS (Set<number>, indices within 14-day cycle)
      compliance: Custody Schedule Days
    definition: >
      The set of day indices within the 14-day cycle on which the children
      are at the Dad's home. Index 0 = parenting_schedule_anchor date.
      Configurable in Settings via the 14-day cycle day picker grid.
    relationships:
      - target: parenting_schedule_anchor
        type: depends_on
        cardinality: "N:1"
      - target: custody_status
        type: consumed_by
        cardinality: "1:N"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: reward_eligibility
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      Admin taps day chips in Settings → saveSchedCfg() writes Set to
      localStorage and updates KIDS_HOME_DAYS live.
      isKidsHome(date) = KIDS_HOME_DAYS.has(dayDiff % 14) where
      dayDiff = floor((date - SCHEDULE_START) / 86400000).
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab, ui_chore_tracker_tab]
      elements: [parenting_schedule_anchor, custody_status]
    notes: >
      Default Smrekar schedule: [0,1,4,5,8,9,12,13] within each 14-day cycle.
      Hot-applied on save — no page reload required.

  - id: custody_status
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:boolean
    constraint:
      description: true = kids at Dad's tonight; false = kids at Mom's today
    ui_display_name: "Kids at Dad's tonight"
    source: parenting_schedule_anchor + parenting_home_days + system clock
    rendering:
      semantic: "Kids at Dad's tonight" / "Kids at Mom's today"
      systems: Custody Status (home | away)
      technical: isKidsHome(new Date()) → boolean
      compliance: Custody State Record
    definition: >
      The computed current custody state — whether the children are scheduled
      to be at the Dad's home tonight or at the other parent's home. Derived
      from the parenting schedule cycle and today's date. Updates every minute.
    relationships:
      - target: parenting_schedule_anchor
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: custody_status_card
        type: consumed_by
        cardinality: "1:1"
      - target: chore_daily_view
        type: consumed_by
        cardinality: "1:N"
      - target: ui_top_bar
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      Source: SCHEDULE_START (Date) + KIDS_HOME_DAYS (Set<number>).
      Middle: dayDiff = floor((ymd(today) - ymd(SCHEDULE_START)) / 86400000);
              cycleDay = dayDiff % 14; home = KIDS_HOME_DAYS.has(cycleDay).
      Target: updateCustodyBadge() sets custody_status_card + renderTodayChores().
      Refresh: setInterval(updateCustodyBadge, 60000).
    relates_to:
      ui_components: [custody_status_card, ui_top_bar]
      elements: [parenting_schedule_anchor, parenting_home_days,
                 next_custody_transition, chore_daily_view]
    notes: >
      Home = true gates all chore and reward computations for the current day.
      Away = true: chore card shows "Kids at Mom's today" message.

  - id: next_custody_transition
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: xsd:date
    ui_display_name: "Back to Dad's Fri Aug 1"
    source: custody_status + parenting_schedule_anchor + parenting_home_days
    rendering:
      semantic: "Back to Dad's Fri Aug 1" / "Back to Mom's Thu Jul 31"
      systems: Next Custody Change Date
      technical: computed in updateCustodyBadge() loop over addDays(today, i)
      compliance: Next Scheduled Transition
    definition: >
      The next calendar date on which custody changes from the current state
      (home→away or away→home). Displayed in the custody_status_card below
      the current state label. Scanned forward up to 14 days from today.
    relationships:
      - target: custody_status
        type: derives_from
        cardinality: "N:1"
      - target: parenting_schedule_anchor
        type: derives_from
        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
      - target: custody_status_card
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      for i in 1..14: if isKidsHome(addDays(today, i)) !== home → transition date.
      Target: #custody-next textContent = "Back to {dadName}'s {weekday} {month} {day}".
    relates_to:
      ui_components: [custody_status_card]
      elements: [custody_status, parenting_home_days]

  - id: parenting_schedule_rule_version
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Schedule version"
    source: localStorage["smrekar_schedule_rules"] (array of rule objects)
    rendering:
      semantic: "Schedule effective from {date}"
      systems: Custody Rule Version
      technical: "{ id, effectiveFrom, anchor, dayOwners, label, createdAt, createdBy }"
      compliance: Custody Agreement Version Record
    definition: >
      One version of the 14-day custody rule, effective from a given date
      forward. Supersedes parenting_schedule_anchor + parenting_home_days as
      a single flat value — the schedule is now a list of these, so a change
      to today's pattern never rewrites how past dates are computed.
      dayOwners is an explicit map of all 14 cycle-day indices to 'dad' or
      'mom' (not a "home days" set implying the complement by default) —
      every day's ownership is unambiguous rather than implied.
    relationships:
      - target: parenting_schedule_anchor
        type: replaces
        cardinality: "1:N"
      - target: parenting_home_days
        type: replaces
        cardinality: "1:N"
      - target: custody_day_log
        type: consumed_by
        cardinality: "1:N"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      ruleForDate(dateKey) returns the latest version whose effectiveFrom
      <= dateKey. Saving in Settings with the same effectiveFrom as the
      current (latest) version amends it in place; a new date pushes a new
      version. Earlier versions are never mutated once superseded.
    relates_to:
      ui_components: [settings_panel, ui_schedule_tab]
      elements: [holiday_override, custody_day_log, observation_report]
    notes: >
      Seeded with two versions on first run: 2026-03-13 (original schedule,
      dad days [0,1,4,5,8,9,12,13]) and 2026-07-27 (50/50 schedule agreed
      2026-07-27, dad days [2,3,4,5,9,10] — Rachel Mon/Tue, Nate Wed/Thu,
      alternating Fri-Sun). A device that only ever saw the pre-versioning
      flat smrekar_schedule_cfg value, or an earlier build of this app that
      stored rules as a `homeDays` array instead of `dayOwners`, migrates
      automatically into the current explicit-map shape via normalizeRule().

  - id: holiday_override
    entity_type: owl:Class
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: owl:Class
    ui_display_name: "Holiday / vacation"
    source: localStorage["smrekar_holidays"] (array of holiday objects)
    rendering:
      semantic: "Christmas Day — Dad's"
      systems: Holiday Owner Override
      technical: "{ id, date, name, owner: 'mom'|'dad', createdAt, createdBy }"
      compliance: Custody Exception Record
    definition: >
      A specific calendar date that belongs wholly to one parent regardless
      of what the active schedule rule would otherwise assign — for named
      holidays, school breaks, or agreed vacation days. Any signed-in user
      can add, edit, or delete one from Settings.
    relationships:
      - target: parenting_schedule_rule_version
        type: extends
        cardinality: "N:1"
      - target: custody_day_log
        type: consumed_by
        cardinality: "1:N"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
      - target: holiday_history_entry
        type: consumed_by
        cardinality: "1:N"
      - target: upcoming_holidays_view
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      CRUD via openHolidayForm()/saveHoliday()/deleteHoliday(), persisted by
      saveHolidaysState(). ownerOfDate(date) checks holidayForDate(ymd(date))
      first; if present, its owner wins over the rule-computed value for
      that date only. Every add/edit/delete also appends to
      holiday_history_entry via logHolidayChange().
    relates_to:
      ui_components: [settings_panel]
      elements: [parenting_schedule_rule_version, observation_report, holiday_history_entry, upcoming_holidays_view]

  - id: upcoming_holidays_view
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Upcoming Holidays"
    source: holiday_override, filtered to future dates and sorted
    rendering:
      semantic: "Christmas Day — Dec 25, 2026 — Dad's"
      systems: Upcoming Holidays Browser (owner filter + date-range + search)
      technical: "renderUpcomingHolidays() → #upcoming-holidays-scroll innerHTML"
      compliance: Scheduled Custody Exception Report
    definition: >
      A browsing view over holiday_override distinct from the add/edit/
      delete list — every future holiday (date >= today), soonest first,
      filterable by owner (all/Dad's/Mom's), narrowable by date range (3mo/
      6mo/1yr/all future), and searchable by name. Rendered as a
      horizontally scrolling row (soonest on the left) rather than a
      vertical list — a deliberate "magazine, left to right" layout choice.
    relationships:
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    transformation: >
      Recomputed on every filter change: HOLIDAYS.filter(date >= today,
      within range, matches owner, matches search).sort(date ascending).
      No separate storage — always derived live from holiday_override, never
      goes stale relative to it.
    relates_to:
      ui_components: [settings_panel]
      elements: [holiday_override]

  - id: holiday_history_entry
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Holiday change history"
    source: localStorage["smrekar_holidays_history"] (append-only array)
    rendering:
      semantic: "Added \"Christmas Day\" (2026-12-25, Dad's) — 2026-07-30"
      systems: Holiday Audit Entry
      technical: "{ ts, action: 'add'|'edit'|'delete', id, date, name, owner, prevDate?, prevName?, prevOwner?, changedBy }"
      compliance: Custody Exception Change Record
    definition: >
      One append-only log entry per add/edit/delete of a holiday_override,
      timestamped and attributed to whichever signed-in user made the
      change — same pattern as reward_history_entry. Visible in the
      Holidays section's "Show History" toggle, most recent first, capped
      to the last 25 shown.
    relationships:
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    transformation: >
      logHolidayChange(action, holiday, prev) appends one entry per
      saveHoliday()/deleteHoliday() call; never mutated or pruned once written.
    relates_to:
      ui_components: [settings_panel]
      elements: [holiday_override]

  - id: theme_preference
    entity_type: owl:DatatypeProperty
    layer: frontend
    primitive: true
    schema_version: "0.3.0"
    migration_status: complete
    data_class: raw
    data_type: xsd:string
    constraint:
      enum: "deepspace | modern | lcars | monolith | retrocrt | bluefin | madscience | neon80s | pacman"
    ui_display_name: "Theme"
    source: localStorage["cabin-theme"]
    rendering:
      semantic: "e.g. \"80s Neon\" or \"Pac-Man\""
      systems: Display Theme Selection
      technical: "THEME_KEY; THEMES[id] → { vars: {CSS custom properties}, fonts: [] }"
      compliance: (not shown)
    definition: >
      Which visual theme is active — a full palette + font-pair swap via CSS
      custom properties (--night, --glass, --gold, --teal, --rose, --cream,
      --radius, --font-display, --font-ui), applied by setting them on
      document.documentElement and a data-theme attribute some theme-specific
      CSS (e.g. Pac-Man's flashing calendar dots) hooks off of. Per-device —
      not synced, same as every other localStorage-backed preference here.
    transformation: >
      applyTheme(id) sets each var via root.style.setProperty(), sets
      root.dataset.theme = id, loads/unloads that theme's Google Fonts link
      tags, and persists to localStorage. renderThemeGrid() reflects the
      active choice in Settings.
    relates_to:
      ui_components: [settings_panel]
      elements: []
    notes: >
      8 presets as of 2026-07-31, added incrementally across sessions:
      deepspace (default), modern, lcars, monolith, retrocrt, bluefin,
      madscience, neon80s ("80s Neon" — magenta/cyan/yellow, Monoton +
      Orbitron, sharp 2px radius), pacman ("Pac-Man" — black/yellow/blue/red,
      Press Start 2P + VT323, 16px radius, animated flashing .ev-pip dots
      scoped to [data-theme="pacman"]). No ontology entry existed for this
      system before 2026-07-31 despite 6 presets already shipped — added
      retroactively per the "ontology is canonical, not optional" directive.

  - id: family_hub_access_log
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    constraint:
      description: visible/exportable only to accounts in the host-configured admin list
    ui_display_name: "Access Log (admin only)"
    source: localStorage["smrekar_access_log"], gated by ADMIN_EMAILS
    rendering:
      semantic: "First accessed / last seen / total time per family member"
      systems: Family Hub Access Log
      technical: "ACCESS_LOG_KEY; startAccessSession()/touchAccessSession() write, isAdminUser() gates read"
      compliance: Per-User Session Activity Record
    definition: >
      First-seen timestamp + session duration per signed-in Google account,
      visible and JSON-exportable only to accounts in ADMIN_EMAILS. Distinct
      from audit_log (a Postgres-backed device-command/state-change record
      on the cabin-backend) — this is client-side, Family Hub-specific, and
      per-browser (not yet synced — same cross-device gap as everything
      else in localStorage, see chore_completion_state's notes).
    relationships:
      - target: current_actor
        type: complements
        cardinality: "N:N"
    relates_to:
      ui_components: [settings_panel]
      elements: []
    notes: >
      ADMIN_EMAILS was a hardcoded array in family-hub.html source
      (nhsmrekar@gmail.com only) until 2026-08-01 — meant a template fork
      would've had to edit and rebuild the app just to change who's an
      admin. Now host-driven via the same Docker-build-arg pattern as
      GOOGLE_CLIENT_ID (see parenting_schedule_rule_version's sibling
      entities for that precedent): ADMIN_EMAILS in .env, comma-separated,
      baked into host-config.js as hostAdminEmails at build time.

  - id: custody_day_log
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Custody day record"
    source: localStorage["smrekar_custody_log"] (date → 'dad'|'mom' map)
    rendering:
      semantic: "Recorded nights: Dad 6, Mom 8"
      systems: Custody Day Fact Table
      technical: "materializeCustodyLog() → { 'YYYY-MM-DD': 'dad'|'mom', ... }"
      compliance: Historical Custody Record
    definition: >
      A materialized, append-only record of which parent actually had the
      children on each date, walked forward one day at a time from the
      earliest known schedule version through today. Once a date is
      recorded it is never overwritten by a later rule or holiday edit —
      the factual record of how the schedule actually ran stays intact.
    relationships:
      - target: parenting_schedule_rule_version
        type: derives_from
        cardinality: "N:1"
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
      - target: observation_report
        type: consumed_by
        cardinality: "1:N"
    transformation: >
      On each app load, materializeCustodyLog() fills in any date from the
      last-recorded day through today via ownerOfDate(date), then persists.
    relates_to:
      ui_components: [ui_schedule_tab]
      elements: [observation_report]
    notes: >
      Local to whichever browser/device ran the materialization — not yet
      synced across devices. See ROADMAP.md for moving this to the shared
      Platform API backend if a cross-device record is needed.

  - id: observation_report
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: derived
    data_type: owl:Class
    ui_display_name: "Observations"
    source: custody_day_log (recorded) + parenting_schedule_rule_version + holiday_override (scheduled)
    rendering:
      semantic: "Recorded: Dad 6 · Mom 8 nights this cycle"
      systems: Custody Pivot Report
      technical: observationsReport(periodType, refDate) → { pastDad, pastMom, futureDad, futureMom }
      compliance: Custody Distribution Report
    definition: >
      Pivot-style reporting of nights per parent over a selected period —
      current 2-week cycle, trailing/upcoming 3 months, or a discrete
      calendar year (Jan 1 - Dec 31). Splits each period into "recorded"
      (dates up to today, from custody_day_log) and "scheduled" (future
      dates, computed live from the active rule and any holidays).
    relationships:
      - target: custody_day_log
        type: derives_from
        cardinality: "N:1"
      - target: parenting_schedule_rule_version
        type: derives_from
        cardinality: "N:1"
      - target: holiday_override
        type: derives_from
        cardinality: "N:1"
    relates_to:
      ui_components: [settings_panel]
      elements: [custody_day_log, parenting_schedule_rule_version, holiday_override]
    notes: >
      Available to any signed-in user, not admin-gated — intended as a
      shared, symmetric record both parents can view, not a one-sided tool.

  - id: custody_status_card
    entity_type: owl:Class
    layer: frontend
    primitive: false
    schema_version: "0.3.0"
    migration_status: complete
    data_class: composite
    data_type: owl:Class
    ui_display_name: "Kids at Dad's / Kids at Mom's"
    source: custody_status + next_custody_transition + hub_family_name
    rendering:
      semantic: Kids at Dad's / Kids at Mom's card
      systems: Custody Status Card
      technical: "#custody-card .glass-card (position:absolute top-right of #top-bar)"
      compliance: (not shown)
    definition: >
      The glass card in the upper-right corner of the Family Hub display
      showing the current custody state (home or away icon, text label)
      and next transition date below it. Updates every minute via setInterval.
    relationships:
      - target: custody_status
        type: derives_from
        cardinality: "N:1"
      - target: next_custody_transition
        type: derives_from
        cardinality: "N:1"
      - target: hub_family_name
        type: depends_on
        cardinality: "N:1"
      - target: ui_top_bar
        type: consumed_by
        cardinality: "1:1"
    transformation: >
      updateCustodyBadge() → sets card className (home|away), icon emoji
      (🏠|👋), #custody-card-status text, #custody-next text.
    relates_to:
      ui_components: [ui_top_bar]
      elements: [custody_status, next_custody_transition, hub_family_name]
    notes: >
