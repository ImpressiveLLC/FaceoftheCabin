        cardinality: "N:1"
      - target: parenting_home_days
        type: derives_from
        cardinality: "N:1"
    transformation: >
      populateSettings() fills all fields from CFG + SCHEDULE_START + KIDS_HOME_DAYS
      when panel opens. saveSettings() reads all fields → writes back to CFG +
      saveSchedCfg() + saveCfg() → triggers downstream updates.
    relates_to:
      ui_components: []
      elements: [hub_config, hub_family_name, google_oauth_client_id,
                 google_calendar_id, parenting_schedule_anchor,
                 parenting_home_days, hub_brand_block]
    notes: >
      Must be last in DOM body due to Chromium backdrop-filter compositing
