[defaults]
# Makes `ansible/roles/` discoverable regardless of which subdirectory the
# invoked playbook lives in (site.yml at the top level vs. playbooks/*.yml
# one level down) — without this, playbooks/rotate-secrets.yml's
# `include_role: name: secrets` fails to find ansible/roles/secrets, since
# Ansible's default role search path is relative to the playbook's own
# directory, not the ansible/ root. Picked up automatically via cwd-relative
# discovery as long as commands are run with `cd ansible` first, matching
# every documented usage in README.md.
roles_path = ./roles
