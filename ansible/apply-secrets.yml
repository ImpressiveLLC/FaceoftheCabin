---
# Standalone entrypoint for re-templating infra/.env after a vault edit,
# without pulling in site.yml's host-provisioning play -- that play sets
# become: true at the play level, which forces even its own implicit
# Gathering Facts step through sudo. When run with --connection=local
# directly on the target host (the common case for "I just edited the
# vault, now apply it"), that sudo prompt is unreliable over some
# terminals/SSH clients (confirmed live 2026-09-03: timed out waiting for
# a become password prompt that should have been straightforward).
#
# This file is the same content as site.yml's second play, kept in sync
# by hand (different purpose: this is the routine "just apply secrets"
# entrypoint; site.yml is full from-scratch host provisioning). Needs
# --vault-password-file to decrypt group_vars/*/vault.yml, same as before.
- name: Template infra/.env from Ansible Vault
  hosts: cabin:home
  become: false
  roles:
    - secrets
