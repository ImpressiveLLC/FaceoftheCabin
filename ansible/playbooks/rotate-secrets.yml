---
# Rotates POSTGRES_PASSWORD end to end: generate -> apply live -> re-encrypt
# the vault -> re-template .env -> restart dependents -> validate. Fails
# loudly (via the assert at the end) rather than leaving a silently broken
# connection — that's the "validated when credentials need to be refreshed"
# requirement this exists for.
#
# GRAFANA_PASSWORD/HA_TOKEN are NOT rotated by this playbook yet — they need
# different mechanics (Grafana's own admin API, HA's long-lived-token UI,
# not just an ALTER USER-equivalent) and are a documented follow-up, not an
# oversight. See ansible/README.md's Secrets section.
#
# Usage:
#   cd ansible
#   ansible-playbook -i inventory.ini playbooks/rotate-secrets.yml \
#     --limit cabin --vault-password-file ~/.ansible_vault_pass
#
# Run manually any time, or automatically via
# .github/workflows/rotate-secrets.yml (monthly).

- name: Rotate cabin-postgres password
  hosts: cabin
  become: false # docker exec / compose don't need root; the deploy user is in the docker group
  vars:
    vault_file: "{{ playbook_dir }}/../group_vars/{{ group_names[0] }}/vault.yml"
    vault_password_file: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE') | default(lookup('env', 'HOME') + '/.ansible_vault_pass', true) }}"

  tasks:
    - name: Generate a new random password
      ansible.builtin.set_fact:
        new_postgres_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Apply the new password to the live cabin-postgres container
      # Matches the manual process this playbook replaces exactly (see
      # docs/DEFINITION_OF_DONE.md's 2026-08-02 entry) — Postgres only
      # applies POSTGRES_PASSWORD at first volume init, so this ALTER is
      # the only thing that actually changes the live credential.
      ansible.builtin.command:
        cmd: >
          docker exec -i cabin-postgres psql -U cabin -d cabin
          -c "ALTER USER cabin WITH PASSWORD '{{ new_postgres_password }}';"
      environment:
        PGPASSWORD: "{{ postgres_password }}" # the OLD value, from group_vars, to authenticate this change
      no_log: true
      register: alter_result
      changed_when: "'ALTER ROLE' in alter_result.stdout"

    - name: Compute a stable temp filename for the decrypt/re-encrypt round-trip
      delegate_to: localhost
      ansible.builtin.set_fact:
        vault_temp_file: "/tmp/vault_rotate_{{ lookup('pipe', 'date +%s%N') }}.yml"

    - name: Re-encrypt the vault with the new password
      delegate_to: localhost
      no_log: true
      block:
        - name: Decrypt the vault to the temp file
          ansible.builtin.command:
            cmd: >
              ansible-vault decrypt {{ vault_file }}
              --vault-password-file {{ vault_password_file }}
              --output {{ vault_temp_file }}

        - name: Replace vault_postgres_password in the decrypted copy
          ansible.builtin.replace:
            path: "{{ vault_temp_file }}"
            regexp: '^vault_postgres_password:.*$'
            replace: 'vault_postgres_password: "{{ new_postgres_password }}"'

        - name: Re-encrypt back over the real vault file
          ansible.builtin.command:
            cmd: >
              ansible-vault encrypt {{ vault_temp_file }}
              --vault-password-file {{ vault_password_file }}
              --output {{ vault_file }}

        - name: Remove the decrypted temp file
          ansible.builtin.file:
            path: "{{ vault_temp_file }}"
            state: absent

    - name: Re-template .env with the new password
      ansible.builtin.include_role:
        name: secrets
      vars:
        postgres_password: "{{ new_postgres_password }}"

    - name: Recreate cabin-backend and cabin-grafana to pick up the new password
      ansible.builtin.command:
        cmd: >
          docker compose -f docker-compose.yml -f docker-compose.m920q.yml
          up -d cabin-backend cabin-grafana
        chdir: "{{ repo_path }}/cabin-orchestration-platform/infra"

    - name: Wait for cabin-backend to report healthy
      ansible.builtin.uri:
        url: "http://localhost:8090/actuator/health"
        return_content: true
        status_code: 200
      register: health_check
      until: (health_check.json.components.db.status | default('')) == 'UP'
      retries: 12
      delay: 5

    - name: Validate the new password actually works — fail loudly, not silently
      ansible.builtin.assert:
        that:
          - health_check.json.status == "UP"
          - health_check.json.components.db.status == "UP"
        fail_msg: >
          Password rotation did NOT validate — cabin-backend is not
          reporting a healthy DB connection after the rotation. The old
          password may still be needed to recover; check
          docs/DEFINITION_OF_DONE.md's manual-rotation entry for the
          recovery steps if this playbook can't be trusted to self-heal.
        success_msg: "cabin-postgres password rotated and validated — db: UP"
