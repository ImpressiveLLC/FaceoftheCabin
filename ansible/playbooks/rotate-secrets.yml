---
# Rotates POSTGRES_PASSWORD end to end: preflight -> generate -> apply live
# -> re-encrypt the vault -> re-template .env -> restart dependents ->
# validate -> commit + push the re-encrypted vault to main. Any failure
# after the live ALTER rolls everything back to the old password and then
# fails loudly — a half-finished rotation must never be left in place.
#
# Why each of those exists (2026-10-01 incident, the first scheduled run to
# get past SSH — the 2026-09-01 run died at "Permission denied (publickey)"
# before touching anything): the old version of this playbook ALTERed the
# live password first, then crashed rendering production-stack .env
# ('vault_blink_username' is undefined), so it never restarted
# cabin-backend. The backend kept the old password, the DB had the new one,
# and the only copy of the new one was an uncommitted vault edit in the
# deploy worktree. Three more latent bugs surfaced in the same recovery:
#   - The final health check waited on components.db.status, which has been
#     hidden since management.endpoint.health.show-details went to "never"
#     (2026-09-01) — it could never pass, even on a clean rotation.
#   - The re-encrypted vault was never committed, so the very next
#     `git reset --hard origin/main` in the deploy worktree threw the new
#     password away, and the next secrets-role run would template the OLD
#     one back into .env.
#   - vault_ha_token was blank in the vault, so templating .env blanked
#     HA_TOKEN live (HaTokenCabinHealthIndicator -> /actuator/health DOWN).
# The preflight below catches the first and last of those before anything
# live changes; the rescue block covers everything else.
#
# GRAFANA_PASSWORD/HA_TOKEN are NOT rotated by this playbook yet — they need
# different mechanics (Grafana's own admin API, HA's long-lived-token UI,
# not just an ALTER USER-equivalent) and are a documented follow-up, not an
# oversight. See ansible/README.md's Secrets section.
#
# Usage:
#   cd ansible
#   ansible-playbook -i inventory.ini playbooks/rotate-secrets.yml \
#     --limit cabin --vault-password-file ~/.ansible_vault_pass
#
# Run manually any time, or automatically via
# .github/workflows/rotate-secrets.yml (monthly). The account running it
# needs push access to main — the preflight checks that up front.

- name: Rotate cabin-postgres password
  hosts: cabin
  become: false # docker exec / compose don't need root; the deploy user is in the docker group
  vars:
    vault_file: "{{ playbook_dir }}/../group_vars/{{ group_names[0] }}/vault.yml"
    vault_password_file: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE') | default(lookup('env', 'HOME') + '/.ansible_vault_pass', true) }}"
    vault_repo_dir: "{{ playbook_dir }}/../.."
    vault_repo_relpath: "ansible/group_vars/{{ group_names[0] }}/vault.yml"
    infra_dir: "{{ repo_path }}/cabin-orchestration-platform/infra"
    # A blank value for any of these breaks a live service the moment the
    # secrets role templates it (blank HA_TOKEN -> /actuator/health DOWN;
    # blank BLINK_* -> blinkbridge can't log in). Undefined vars elsewhere
    # are caught separately by the dry render below.
    required_nonempty_secrets:
      - vault_postgres_password
      - vault_ha_token
      - vault_blink_username
      - vault_blink_password
    rotation_altered: false
    rendered_env_files:
      - { template: env.j2, live: "{{ infra_dir }}/.env" }
      - { template: production-stack-env.j2, live: "{{ infra_dir }}/production-stack/.env" }

  tasks:
    # ---- Preflight: nothing live changes until all of this passes ----------

    - name: Preflight — required vault secrets are defined and non-empty
      ansible.builtin.assert:
        that: (lookup('ansible.builtin.vars', item, default='') | string | length) > 0
        fail_msg: "{{ item }} is missing or blank in {{ vault_repo_relpath }} — fix the vault first; nothing has been changed."
        quiet: true
      loop: "{{ required_nonempty_secrets }}"
      loop_control:
        label: "{{ item }}" # the name only, never the value

    - name: Preflight — render both env files and refuse to blank a live value
      block:
        - name: Dry-render both env templates (catches any undefined var)
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/secrets/templates/{{ item.template }}"
            dest: "/tmp/rotate-preflight-{{ item.template }}"
            mode: "0600"
          loop: "{{ rendered_env_files }}"
          loop_control:
            label: "{{ item.template }}"
          no_log: true

        - name: No key renders blank where the live file has a value
          # The general rule behind both 2026-10-01 near-misses: a blank
          # vault_ha_token templated HA_TOKEN= over a working token, and a
          # blank vault_camera_password would do the same to Frigate's
          # CAMERA_PASSWORD. Compares key by key and prints key NAMES only.
          ansible.builtin.shell:
            cmd: |
              awk -F= '
                FNR == 1 { file++ }
                /^[A-Za-z_][A-Za-z0-9_]*=/ {
                  k = $1; v = substr($0, length(k) + 2); gsub(/["\047[:space:]]/, "", v)
                  if (file == 1 && v != "") live[k] = 1
                  if (file == 2 && v == "" && (k in live)) print k
                }' {{ item.live | quote }} /tmp/rotate-preflight-{{ item.template }}
            executable: /bin/bash
          loop: "{{ rendered_env_files }}"
          loop_control:
            label: "{{ item.template }}"
          register: blanked_keys
          changed_when: false
          failed_when: blanked_keys.stdout | length > 0

      always:
        - name: Remove the dry-render output
          ansible.builtin.file:
            path: "/tmp/rotate-preflight-{{ item.template }}"
            state: absent
          loop: "{{ rendered_env_files }}"
          loop_control:
            label: "{{ item.template }}"

      rescue:
        - name: Fail with the keys that would have been blanked
          ansible.builtin.fail:
            msg: >
              Refusing to rotate — the vault would blank live values:
              {{ blanked_keys.results | default([]) | selectattr('stdout', 'defined')
                 | map(attribute='stdout_lines') | flatten | join(', ') or 'see the failed task above' }}.
              Add the real values to {{ vault_repo_relpath }} first; nothing has been changed.

    - name: Preflight — vault file has no uncommitted changes
      # This playbook commits exactly the vault it re-encrypts; a stray
      # local edit would either be pushed unreviewed or silently lost.
      delegate_to: localhost
      ansible.builtin.command:
        cmd: git diff --quiet HEAD -- {{ vault_repo_relpath }}
        chdir: "{{ vault_repo_dir }}"
      changed_when: false

    - name: Preflight — can push to main
      delegate_to: localhost
      ansible.builtin.command:
        cmd: git push --dry-run origin HEAD:refs/heads/rotate-secrets-preflight
        chdir: "{{ vault_repo_dir }}"
      changed_when: false

    - name: Record the starting commit (rollback point for the vault)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ vault_repo_dir }}"
      register: start_head
      changed_when: false

    - name: Remember the current password and generate a new one
      ansible.builtin.set_fact:
        old_postgres_password: "{{ postgres_password }}"
        new_postgres_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true

    # ---- Rotation: any failure from here on rolls back -------------------

    - name: Rotate, or roll back on any failure
      block:
        - name: Apply the new password to the live cabin-postgres container
          # Postgres only applies POSTGRES_PASSWORD at first volume init, so
          # this ALTER is the only thing that actually changes the live
          # credential. Runs over the container's local socket.
          ansible.builtin.command:
            cmd: >
              docker exec -i cabin-postgres psql -U cabin -d cabin
              -c "ALTER USER cabin WITH PASSWORD '{{ new_postgres_password }}';"
          environment:
            PGPASSWORD: "{{ old_postgres_password }}"
          no_log: true
          register: alter_result
          changed_when: "'ALTER ROLE' in alter_result.stdout"

        - name: Mark the live password as changed (enables the DB rollback)
          ansible.builtin.set_fact:
            rotation_altered: true

        - name: Compute a stable temp filename for the decrypt/re-encrypt round-trip
          delegate_to: localhost
          ansible.builtin.set_fact:
            vault_temp_file: "/tmp/vault_rotate_{{ lookup('pipe', 'date +%s%N') }}.yml"

        - name: Re-encrypt the vault with the new password
          delegate_to: localhost
          no_log: true
          block:
            - name: Decrypt the vault to the temp file
              ansible.builtin.command:
                cmd: >
                  ansible-vault decrypt {{ vault_file }}
                  --vault-password-file {{ vault_password_file }}
                  --output {{ vault_temp_file }}

            - name: Replace vault_postgres_password in the decrypted copy
              ansible.builtin.replace:
                path: "{{ vault_temp_file }}"
                regexp: '^vault_postgres_password:.*$'
                replace: 'vault_postgres_password: "{{ new_postgres_password }}"'
              register: vault_replace
              failed_when: not vault_replace.changed

            - name: Re-encrypt back over the real vault file
              ansible.builtin.command:
                cmd: >
                  ansible-vault encrypt {{ vault_temp_file }}
                  --vault-password-file {{ vault_password_file }}
                  --output {{ vault_file }}
          always:
            - name: Remove the decrypted temp file
              ansible.builtin.file:
                path: "{{ vault_temp_file }}"
                state: absent

        - name: Re-template .env with the new password
          ansible.builtin.include_role:
            name: secrets
          vars:
            postgres_password: "{{ new_postgres_password }}"

        - name: Recreate cabin-backend and cabin-grafana to pick up the new password
          ansible.builtin.command:
            cmd: >
              docker compose -f docker-compose.yml -f docker-compose.m920q.yml
              up -d cabin-backend cabin-grafana
            chdir: "{{ infra_dir }}"

        - name: Wait for cabin-backend to report healthy
          # Aggregate status only — component details are hidden
          # (show-details: never), and the aggregate already includes the
          # db indicator, so UP here means the new password works.
          ansible.builtin.uri:
            url: "http://localhost:8090/actuator/health"
            return_content: true
            status_code: [200, 503]
          register: health_check
          until: ((health_check.json | default({})).status | default('')) == 'UP'
          retries: 24
          delay: 5

        - name: Commit the re-encrypted vault and push it to main
          # Builds one commit directly on top of origin/main with only the
          # vault changed, so it's safe from whatever branch this checkout
          # is on (pushing HEAD from a feature branch would push that whole
          # branch). Retries if main moved underneath us.
          delegate_to: localhost
          ansible.builtin.shell:
            cmd: |
              set -eu
              blob=$(git hash-object -w {{ vault_repo_relpath }})
              for attempt in 1 2 3; do
                git fetch -q origin main
                export GIT_INDEX_FILE=$(mktemp)
                git read-tree origin/main
                git update-index --cacheinfo 100644,"$blob",{{ vault_repo_relpath }}
                tree=$(git write-tree)
                rm -f "$GIT_INDEX_FILE"; unset GIT_INDEX_FILE
                # D25 guard: pushing to main without a PR is allowed only for a
                # commit that changes exactly the vault file. The tree above is
                # origin/main plus one blob, so it cannot hold anything else
                # today; this keeps that true if the step is ever edited.
                changed=$(git diff-tree -r --name-only origin/main "$tree")
                if [ -z "$changed" ]; then
                  echo "vault already matches origin/main; nothing to push"
                  exit 0
                fi
                if [ "$changed" != "{{ vault_repo_relpath }}" ]; then
                  echo "refusing to push to main: this commit would change more than the vault file:" >&2
                  echo "$changed" >&2
                  exit 1
                fi
                commit=$(git -c user.name="cabin rotate-secrets" -c user.email="rotate-secrets@cabin-hub" \
                  commit-tree "$tree" -p origin/main \
                  -m "vault: rotate vault_postgres_password ($(date -u +%Y-%m-%d))" \
                  -m "Automated by ansible/playbooks/rotate-secrets.yml (workflow run ${GITHUB_RUN_ID:-manual}) after the new password validated live.")
                if git push -q origin "$commit":refs/heads/main; then
                  echo "pushed $commit"
                  exit 0
                fi
                sleep 5
              done
              echo "push to main failed 3 times" >&2
              exit 1
            chdir: "{{ vault_repo_dir }}"
          register: vault_push

      rescue:
        - name: Roll back — restore the old password on the live database
          ansible.builtin.command:
            cmd: >
              docker exec -i cabin-postgres psql -U cabin -d cabin
              -c "ALTER USER cabin WITH PASSWORD '{{ old_postgres_password }}';"
          no_log: true
          when: rotation_altered | bool

        - name: Roll back — restore the committed vault file
          delegate_to: localhost
          ansible.builtin.command:
            cmd: git checkout {{ start_head.stdout }} -- {{ vault_repo_relpath }}
            chdir: "{{ vault_repo_dir }}"

        - name: Roll back — put the old password back in infra/.env
          # Only this one line — re-running the whole template is what may
          # have just failed.
          ansible.builtin.lineinfile:
            path: "{{ infra_dir }}/.env"
            regexp: '^POSTGRES_PASSWORD='
            line: "POSTGRES_PASSWORD={{ old_postgres_password }}"
          no_log: true

        - name: Roll back — recreate dependents on the old password
          ansible.builtin.command:
            cmd: >
              docker compose -f docker-compose.yml -f docker-compose.m920q.yml
              up -d cabin-backend cabin-grafana
            chdir: "{{ infra_dir }}"
          ignore_errors: true

        - name: Roll back — check cabin-backend came back
          ansible.builtin.uri:
            url: "http://localhost:8090/actuator/health"
            return_content: true
            status_code: [200, 503]
          register: rollback_health
          until: ((rollback_health.json | default({})).status | default('')) == 'UP'
          retries: 24
          delay: 5
          ignore_errors: true

        - name: Fail loudly — the rotation did not happen
          ansible.builtin.fail:
            msg: >
              Password rotation FAILED at "{{ ansible_failed_task.name | default('unknown task') }}"
              and was rolled back to the old password.
              cabin-backend after rollback: {{ (rollback_health.json | default({})).status | default('UNKNOWN') }}.
              {{ '' if ((rollback_health.json | default({})).status | default('')) == 'UP' else
                 'Rollback did NOT come back healthy — see docs/MAINTENANCE.md (Secrets) and check `docker logs cabin-backend`.' }}

    - name: Sync this checkout's vault with what was pushed
      # Automation-only deploy worktree: fast-forward it to main so it stays
      # clean for the deploy workflows' preflight. Any other checkout is
      # left with the (already-pushed) vault as a local modification —
      # `git checkout -- <vault>` then a normal pull picks it up.
      delegate_to: localhost
      ansible.builtin.shell:
        cmd: |
          set -eu
          if [ "$(git branch --show-current)" = "deploy-main" ]; then
            git fetch -q origin main && git reset -q --hard origin/main
            echo "deploy worktree reset to origin/main"
          else
            echo "not deploy-main: vault left modified locally; it already matches main"
          fi
        chdir: "{{ vault_repo_dir }}"
      changed_when: false

    - name: Report success
      ansible.builtin.debug:
        msg: "cabin-postgres password rotated, validated (status UP), and vault pushed: {{ vault_push.stdout_lines | last }}"
