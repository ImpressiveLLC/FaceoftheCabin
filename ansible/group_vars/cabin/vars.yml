---
# Plain (non-vaulted) config + the indirection layer that names each
# vault-sourced secret without requiring decryption just to see what
# variables exist. Safe to commit — no actual secret values live here.

postgres_password: "{{ vault_postgres_password }}"
grafana_password: "{{ vault_grafana_password }}"
ha_token: "{{ vault_ha_token }}"
home_ha_token: "{{ vault_home_ha_token }}"
camera_password: "{{ vault_camera_password }}"
# Optional — Tech ID Service findings-submission key (see
# docs/REPLICATION.md §8). Defaults to empty rather than requiring a
# vault edit up front: an unset key is a valid, working state (the
# backend just refuses submissions with 503 until an operator opts in).
# Add `vault_tech_id_api_key` to vault.yml and remove the default here
# once you actually want a provider to be able to submit findings.
tech_id_api_key: "{{ vault_tech_id_api_key | default('') }}"
# Optional — Anthropic API key for cabin-discovery's device self-discovery
# lookup (web search + summarization). Same "empty is a valid, working
# state" pattern as tech_id_api_key above: unset just keeps discovery in
# local-catalog-only mode (whatever the discovering integration already
# reported), no external calls, no device metadata leaves the host.
# Add `vault_anthropic_api_key` to vault.yml to enable the real lookup.
anthropic_api_key: "{{ vault_anthropic_api_key | default('') }}"
# Optional, paired with anthropic_api_key above -- only required for an
# "identity-linked" API key (Anthropic's per-member key type on an
# Individual Org plan), which otherwise gets rejected with a 400 on every
# request. A workspace-owned key on a paid team org may not need this at
# all -- see docker-compose.m920q.yml's own comment on this var.
anthropic_workspace_id: "{{ vault_anthropic_workspace_id | default('') }}"
# Optional — Uptime Kuma admin login, for the not-yet-built config-as-code
# reconciler (see docs/REPLICATION.md Sec 10's Kuma decision record and
# MAINTENANCE.md). Same "empty is a valid, working state" pattern as the
# others above: unset just means the reconciler can't run yet, monitors
# stay UI-managed. Kuma's own monitor-write surface is an internal
# Socket.IO API, not a public REST endpoint — there is no read-only
# "API key" equivalent here the way there is for tech_id/anthropic above,
# it genuinely has to be the real admin login. Add `vault_uptime_kuma_username`
# / `vault_uptime_kuma_password` to vault.yml when ready to build/run that
# reconciler — do not add them speculatively before the reconciler code
# itself exists and has been reviewed.
uptime_kuma_username: "{{ vault_uptime_kuma_username | default('') }}"
uptime_kuma_password: "{{ vault_uptime_kuma_password | default('') }}"
# Node-RED editor/admin auth -- found live 2026-08-24 that adminAuth and
# httpNodeAuth were both unset (zero authentication, no framing-protection
# headers either -- see docs/DEFINITION_OF_DONE.md's matching entry).
# Same "empty is a valid, working state" pattern as tech_id_api_key above:
# unset just leaves Node-RED exactly as insecure as it already was, this
# doesn't make anything worse. Add `vault_nodered_admin_username` /
# `vault_nodered_admin_password` to vault.yml and run
# playbooks/enable-nodered-auth.yml when ready to close this gap.
nodered_admin_username: "{{ vault_nodered_admin_username | default('') }}"
nodered_admin_password: "{{ vault_nodered_admin_password | default('') }}"
# ntfy.sh push-notification topic for CRITICAL workflow/automation alerts
# (WorkflowRuleService's publishUnconfirmedAlert, AutomationRuleService's
# triggerAlert). Optional — see application.yml's ntfyTopic default: blank
# just means CRITICAL events still persist and show in the UI, they just
# don't also push to a phone. Add `vault_cabin_alert_ntfy_topic` when
# ready — ntfy topics are unauthenticated-by-default, so treat the topic
# name itself as a shared secret (anyone who knows it can publish/subscribe
# unless the topic is protected on ntfy's side).
cabin_alert_ntfy_topic: "{{ vault_cabin_alert_ntfy_topic | default('') }}"
# Resend (resend.com) API key for Sprint 4's Tier 2 managed-user
# passwordless magic-link invite emails (ManagedUserService/
# ResendEmailSender). Optional, empty by default -- an unset key is a
# valid, working state (inviting a managed user fails loudly with a
# clear error rather than silently). Add `vault_resend_api_key` to
# vault.yml when ready to actually use Tier 2 managed users; Tier 1 guest
# links and normal Google sign-in need nothing here.
resend_api_key: "{{ vault_resend_api_key | default('') }}"
# Shared secret for POST /api/webhooks/blink-motion (BlinkMotionWebhookController)
# -- optional per its own graceful-degradation design (503 until set), but
# THIS INSTANCE already has a real, live, in-use value that was set directly
# in .env at some point and never wired into this template at all -- found
# 2026-09-03 when a routine re-template of .env (for the unrelated Resend
# key) silently dropped it, breaking the phone-side motion-notification
# webhook until caught and restored from an old .env backup. Add
# `vault_blink_motion_webhook_api_key` to vault.yml with the value already
# live in .env (see docs/MAINTENANCE.md before rotating it) so this can
# never silently regress on a future re-template again.
blink_motion_webhook_api_key: "{{ vault_blink_motion_webhook_api_key | default('') }}"

# Production-stack credentials — the pre-existing, separately-managed
# mosquitto/HA/Frigate/blinkbridge/cloudflared/etc. stack, brought under
# git version control 2026-08-14. These credentials already exist and are
# needed by already-running live services, but were never brought into the
# vault, so a cloned instance had no way to reproduce them.
#
# blink_username/blink_password are REQUIRED (no `default('')` — unlike
# tech_id/anthropic above, an empty value here would break something that
# currently works) and ARE templated into a real file — see
# production-stack-env.j2. Do NOT run that templating task until these
# are populated with the REAL CURRENT values (transcribed from the live
# host, not invented) — see ansible/README.md's credential checklist.
blink_username: "{{ vault_blink_username }}"
blink_password: "{{ vault_blink_password }}"

# cloudflare_tunnel_token is vault-STORED ONLY, for backup/reference —
# cloudflared is deliberately outside this repo's compose/ansible
# management today (token-based tunnel, no local config file this repo
# drives — see docker-compose.m920q.yml's cabin-ui comment), so this value
# is never templated into any generated file. It exists here purely so the
# token isn't lost/undocumented if cloudflared ever needs recreating. It's
# straightforward to bring under real ansible management later (a third
# templated file + a cloudflared service block) if that's ever wanted —
# nothing about this indirection layer blocks that.
cloudflare_tunnel_token: "{{ vault_cloudflare_tunnel_token | default('') }}"

# Non-secret config, templated into .env alongside the vaulted values so
# infra/.env has one generation source instead of being partly-managed.
family_hub_url: "https://hub.unicornpingpong.com"
cabin_api_url: "https://api.unicornpingpong.com"
# Where a Tier 2 managed user's magic link points after the token itself --
# must match cabin-ui's real public origin, confirmed against docs/USER_GUIDE.md.
cabin_frontend_origin: "https://cabin.unicornpingpong.com"
# Not a secret (Web application Client IDs are visible client-side by
# design — see .env.m920q.example) — real value confirmed 2026-08-02 via
# the live family-hub container's baked host-config.js, since the .env
# this value originally came from had already gone stale/empty (see
# rotate-secrets.yml's comments and ansible/README.md's Secrets section
# for the drift this was found fixing).
google_client_id: "434674277184-7666hg0mhh9o3k0dk1rhv17c6o05qvtt.apps.googleusercontent.com"
# Optional — needed only for server-side OAuth flows (Grafana's own
# Google login, added 2026-08-04) as opposed to the client-side implicit
# flow family-hub/cabin-ui use, which never needs a secret. Unlike
# google_client_id, this genuinely is a secret (a server-side OAuth flow
# can impersonate the app with it) — get it from Google Cloud Console →
# APIs & Services → Credentials → the existing Web application client →
# "Client secret". Add `vault_google_client_secret` to vault.yml; empty
# is a valid, working state (Grafana's Google auth just stays disabled
# — see docker-compose.m920q.yml's cabin-grafana GF_AUTH_GOOGLE_ENABLED).
google_client_secret: "{{ vault_google_client_secret | default('') }}"
admin_emails: "nhsmrekar@gmail.com"
home_ha_url: ""
