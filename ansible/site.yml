---
# Idempotent host setup for FaceoftheCabin. Safe to re-run — every task
# either checks state first or is naturally idempotent (package install,
# systemd unit, git clone-or-pull).
#
# Usage:
#   ansible-playbook -i inventory.ini site.yml --limit cabin \
#     -e github_runner_token=<paste from GitHub repo Settings -> Actions -> Runners -> New runner>
#
# The runner registration token is short-lived (~1 hour) and generated by
# GitHub on demand — it is never stored in this repo. Passed as a one-time
# -e flag, used once, then irrelevant (the runner's own long-lived
# credentials are what persist afterward, stored only on the host itself).

- name: Provision self-hosted host (cabin or home)
  hosts: cabin:home
  become: true
  vars:
    github_runner_version: "2.319.1"
    github_repo: "ImpressiveLLC/FaceoftheCabin"
  roles:
    - cabin_host

# Separate play, not become:true — templating .env only needs the deploy
# user's own permissions (see roles/secrets' own comments), and running it
# unprivileged limits what a mistake in this role could touch. Requires
# --vault-password-file to decrypt group_vars/*/vault.yml; skip with
# --skip-tags secrets if running site.yml somewhere without vault access
# (e.g. a fresh host before the vault password file has been placed there).
- name: Template infra/.env from Ansible Vault
  hosts: cabin:home
  become: false
  tags: [secrets]
  roles:
    - secrets
