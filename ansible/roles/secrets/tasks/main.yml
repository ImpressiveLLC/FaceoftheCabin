---
# Templates infra/.env on the target host from group_vars (vault-sourced
# secrets + plain config vars). Replaces hand-editing .env over SSH — see
# docs/ontology.yaml's platform_secret entity for why this exists.
#
# Requires group_vars/{cabin,home}/vault.yml to be decryptable — run with
# --vault-password-file (see ansible/README.md's Secrets section).

- name: Ensure infra directory exists
  ansible.builtin.file:
    path: "{{ repo_path }}/cabin-orchestration-platform/infra"
    state: directory
    mode: "0755"

- name: Template .env from vault + vars
  ansible.builtin.template:
    src: env.j2
    dest: "{{ repo_path }}/cabin-orchestration-platform/infra/.env"
    mode: "0600" # contains secrets — owner read/write only, matches the
    # existing convention that .env is gitignored and never world-readable
  no_log: true # rendered content includes every secret in plaintext
