---
# Templates infra/.env on the target host from group_vars (vault-sourced
# secrets + plain config vars). Replaces hand-editing .env over SSH — see
# docs/ontology.yaml's platform_secret entity for why this exists.
#
# Requires group_vars/{cabin,home}/vault.yml to be decryptable — run with
# --vault-password-file (see ansible/README.md's Secrets section).

- name: Ensure infra directory exists
  ansible.builtin.file:
    path: "{{ repo_path }}/cabin-orchestration-platform/infra"
    state: directory
    mode: "0755"

- name: Template .env from vault + vars
  ansible.builtin.template:
    src: env.j2
    dest: "{{ repo_path }}/cabin-orchestration-platform/infra/.env"
    mode: "0600" # contains secrets — owner read/write only, matches the
    # existing convention that .env is gitignored and never world-readable
  no_log: true # rendered content includes every secret in plaintext

# Added 2026-08-15 — the production-stack's own .env (mosquitto/HA/
# Frigate/blinkbridge/etc.) had zero ansible coverage until now, despite
# holding real, already-live-required credentials (BLINK_USERNAME/
# BLINK_PASSWORD). Deliberately a SEPARATE task/file from the one above,
# not merged into it — these are two genuinely distinct stacks with two
# distinct generated env files (see production-stack-env.j2's own header
# comment). Run this task ONLY after group_vars/cabin/vault.yml has real
# values for vault_blink_username/vault_blink_password — an empty render
# would overwrite a currently-working live credential with nothing. See
# ansible/README.md's credential checklist.
- name: Template production-stack .env from vault + vars
  ansible.builtin.template:
    src: production-stack-env.j2
    dest: "{{ repo_path }}/cabin-orchestration-platform/infra/production-stack/.env"
    mode: "0600"
  no_log: true
