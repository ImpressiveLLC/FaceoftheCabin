# Ansible inventory — hosts reachable only via Tailscale.
# Use Tailscale hostnames, never LAN/public IPs (see CLAUDE.md networking notes).

[cabin]
cabin-hub ansible_host=cabin-hub ansible_user=ubuntu

[home]
home-hub ansible_host=home-hub ansible_user=ubuntu

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
repo_url=https://github.com/ImpressiveLLC/FaceoftheCabin.git
repo_path=/opt/FaceoftheCabin
