# Ansible inventory — hosts reachable only via Tailscale.
# Use Tailscale hostnames, never LAN/public IPs (see CLAUDE.md networking notes).
#
# cabin-hub/ansible_user/repo_path corrected 2026-08-02 — this file had
# never been updated to match the real M920q (found while building Phase 1
# of the secrets-automation work): the actual deploy user is `nate`, not
# `ubuntu`, the actual Tailscale MagicDNS name is
# nates-little-m920q.tailb20f8b.ts.net (confirmed live all session via SSH),
# and the repo path in use is /home/nate/FaceoftheCabin, not /opt — /opt
# itself needs root just to create a directory in (see cabin_host role
# comments), so the deploy user's home was always the real target. Every
# manual deploy and this session's Ansible work used the corrected values;
# this file just hadn't caught up.

[cabin]
cabin-hub ansible_host=nates-little-m920q.tailb20f8b.ts.net ansible_user=nate

[home]
home-hub ansible_host=home-hub ansible_user=ubuntu

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
repo_url=https://github.com/ImpressiveLLC/FaceoftheCabin.git
repo_path=/home/nate/FaceoftheCabin
