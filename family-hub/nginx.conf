server {
    listen 80;
    root /usr/share/nginx/html;
    index family-hub.html;

    location / {
        try_files $uri $uri/ /family-hub.html;
    }

    # Cache SVG/CSS assets but not the HTML itself
    location ~* \.(svg|css|js|png|jpg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /family-hub.html {
        add_header Cache-Control "no-cache";
    }

    # host-config.js matches the \.js$ immutable-cache rule above but must
    # never be cached that way — it's regenerated fresh on every image build
    # with deploy-specific values (GOOGLE_CLIENT_ID, ADMIN_EMAILS,
    # CABIN_API_URL). An exact `location =` block outranks the regex
    # location above regardless of block order, so this wins. Found
    # 2026-08-01: a live redeploy's new cabinApiUrl value didn't reach a
    # real request because Cloudflare had cached the old 7-day-immutable
    # response — same class of bug, one layer further out, not fixed by
    # this alone (see session notes on purging the existing cached copy).
    location = /host-config.js {
        add_header Cache-Control "no-cache";
    }
}
