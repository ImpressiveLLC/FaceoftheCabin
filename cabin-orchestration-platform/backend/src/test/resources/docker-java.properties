# Testcontainers' own Docker-detection probe (UnixSocketClientProviderStrategy)
# hardcodes API version 1.32 independent of any configured docker-java client
# version -- DOCKER_HOST/DOCKER_API_VERSION env vars don't reach it. This host's
# Docker Engine (MinAPIVersion 1.40) rejects that probe outright. This
# classpath properties file is read earlier in docker-java's config resolution
# and does get honored by the probe. Matches a documented fix for the same
# failure against Docker 29.2.1 (Testcontainers issue tracker, March 2026).
api.version=1.44
