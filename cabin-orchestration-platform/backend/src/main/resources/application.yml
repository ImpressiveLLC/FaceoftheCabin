server:
  port: ${SERVER_PORT:8090}

spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/cabin
    username: cabin
    password: ${POSTGRES_PASSWORD:cabin_dev_password}
    driver-class-name: org.postgresql.Driver

cabin:
  name: Cumberland Cabin
  mqtt:
    brokerUrl: ${MQTT_URL:tcp://localhost:1883}
    clientId: cabin-orchestrator
  kafka:
    bootstrapServers: ${KAFKA_BOOTSTRAP:localhost:9092}
  dashboard:
    familyDashboardUrl: ${FAMILY_DASHBOARD_URL:http://localhost:8081}
  # Template configuration fields -- see ROADMAP.md's "Template
  # Configuration Fields" for the full required-setup list a new instance
  # clone must fill in. Surfaced to the UI via DashboardController's
  # /api/dashboard/config and displayed in the Config panel.
  instance:
    platform: ${CABIN_INSTANCE_PLATFORM:Not configured — set CABIN_INSTANCE_PLATFORM}
    remoteAccess: ${CABIN_INSTANCE_REMOTE_ACCESS:Tailscale}
  homeassistant:
    url: ${HA_URL:http://localhost:8123}
    token: ${HA_TOKEN:}
  locations:
    home:
      homeassistant:
        url: ${HOME_HA_URL:http://home-hub:8123}
        token: ${HOME_HA_TOKEN:}
  google:
    calendarId: ${GOOGLE_CALENDAR_ID:primary}
    oauthClientId: ${GOOGLE_CLIENT_ID:}
    oauthClientSecret: ${GOOGLE_CLIENT_SECRET:}
  devices:
    waterPressure:
      lowPsiAlert: 30
      highPsiAlert: 75
    thermostat:
      freezeRiskTempF: 38
    cameras:
      defaultProtocol: rtsp
      # Frigate reached by Docker network hostname -- cabin-backend is on
      # cabin_default (confirmed via `docker inspect`), the same network
      # Frigate itself runs on, alongside its own infra_default network.
      # Frigate stays Tailscale-only for its own admin UI/API generally,
      # but this specific proxy (snapshot/clip/live-view media only, not
      # config) is what lets cabin-ui's authenticated Camera Events panel
      # show real video without exposing Frigate's full surface publicly.
      frigateUrl: ${FRIGATE_URL:http://frigate:5000}
      # blinkbridge's own liveview control API (added 2026-08-03) --
      # cabin_default-only, no host port published, so this default
      # container-name URL is expected to just work without overriding.
      blinkBridgeUrl: ${BLINKBRIDGE_URL:http://blinkbridge:8811}
      # "cabinCameraName:blinkDeviceName" pairs, comma-separated. Empty
      # by default -- an instance with no Blink camera needs nothing
      # here, and startLiveview/stopLiveview become harmless no-ops for
      # every camera. See CameraMediaController's javadoc.
      blinkCameraMap: ${BLINK_CAMERA_MAP:driveway:Outdoor 4 - DHEE}
      reconciliation:
        # FrigateEventReconciliationService: Frigate's own REST event
        # history is the authoritative, durable system of record for
        # clip/snapshot availability -- MQTT (cabin/camera/events) is only
        # a low-latency hint, published at Frigate's own QoS 0 with no
        # redelivery guarantee, and is not sufficient on its own (see that
        # class's javadoc). This periodic reconciliation is what actually
        # closes the "watch clip never works" gap. Defaults match this
        # deployment's own confirmed Frigate retention (5 days).
        backfillDays: ${CAMERA_RECONCILIATION_BACKFILL_DAYS:5}
        overlapSeconds: ${CAMERA_RECONCILIATION_OVERLAP_SECONDS:300}
        pageLimit: ${CAMERA_RECONCILIATION_PAGE_LIMIT:200}
  alerts:
    # ntfy.sh topic for CRITICAL-severity CabinEvents (water leak / smoke /
    # alarm) — same delivery mechanism as the existing Node-RED overnight-
    # camera-alert flow. The topic name functions as a shared secret (ntfy.sh
    # topics aren't access-controlled), so this stays unset here and is only
    # ever set in infra/.env on the actual host, never committed. Empty by
    # default = CRITICAL events still save to cabin_event, just no push.
    ntfyTopic: ${CABIN_ALERT_NTFY_TOPIC:}
  techid:
    # Shared secret any Tech ID Service provider (this instance's own
    # scheduled Claude Code routine, an operator's paid scanning tier, or
    # an instance owner's bring-your-own-AI pipeline) must present via
    # X-Tech-Id-Api-Key to POST /api/tech-id/findings. Unset by default --
    # submission is refused (503) until an operator opts in, since this
    # is a write endpoint reachable from the open internet. See
    # docs/REPLICATION.md's Tech ID Service section for setup.
    apiKey: ${TECH_ID_API_KEY:}
  blinkMotionWebhook:
    # Shared secret a phone-side notification-listener automation
    # (Tasker/MacroDroid watching for the Blink app's own push
    # notification) must present via X-Blink-Motion-Api-Key to
    # POST /api/webhooks/blink-motion. Added 2026-08-16 after live M920q
    # diagnostics confirmed Blink's own clip/motion API never fires for
    # this account -- home_aldrich_front and driveway came back identical
    # on every attribute blinkpy exposes (subscription, sync-module arm
    # state, motion_enabled), yet only driveway ever produces a clip.
    # See BlinkMotionWebhookController's javadoc. Unset by default --
    # refused (503) until an operator opts in, same reasoning as
    # techid.apiKey above.
    apiKey: ${BLINK_MOTION_WEBHOOK_API_KEY:}
  # Path docs/ontology.yaml is readable at inside the running container --
  # see OntologyLookupService's javadoc for why this needs a bind mount
  # (docker-compose.m920q.yml) rather than being baked into the image.
  ontology:
    path: ${ONTOLOGY_PATH:/app/docs/ontology.yaml}
  # Tiered telemetry retention (added 2026-08-25) -- see
  # TelemetryArchivalService's own javadoc for the full "why". archiveDir
  # must be a real read-write bind mount to /storage (the M920q's actual
  # HDD, not the container's own ephemeral filesystem) -- see
  # docker-compose.m920q.yml's matching volume entry.
  telemetryArchival:
    enabled: ${TELEMETRY_ARCHIVAL_ENABLED:true}
    hotRetentionMonths: ${TELEMETRY_ARCHIVAL_HOT_MONTHS:3}
    archiveDir: ${TELEMETRY_ARCHIVAL_DIR:/app/archives/cabin_event}
    cron: ${TELEMETRY_ARCHIVAL_CRON:0 0 2 1 * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
