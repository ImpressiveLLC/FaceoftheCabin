# D22 R-DM-10 / DL-2026-09-23-11 (folds into W-2b): /view/{token} and
# /demo/{token} carry a live access token as a path segment, and Tier 1
# requests may carry it as ?t=. The stock log format records the full
# request line, so every page load wrote the token to this container's
# access log. Log the path only ($uri -- no query string), with the token
# segment of /view/* and /demo/* replaced. This file is installed into
# conf.d, i.e. the http context, so map/log_format are valid here.
map $uri $cabin_log_uri {
    "~^/(?<cabin_tier>view|demo)/[^/]+(?<cabin_rest>.*)$"  "/$cabin_tier/[token]$cabin_rest";
    default                                                $uri;
}
log_format cabin_masked '$remote_addr - [$time_local] "$request_method $cabin_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log cabin_masked;

    # All routes fall through to index.html (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # D22 Demo Access page (R-DM-10): same SPA, never indexed, never sent
    # as a Referer (the token is in this URL), never cached.
    location /demo/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        # Serve index.html from THIS location: a try_files fallback that is
        # its last argument is an internal redirect to "location /", which
        # would drop the three headers above.
        try_files /index.html =404;
    }

    # Proxy /api/* to the Spring Boot backend
    location /api/ {
        proxy_pass http://cabin-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # D20: GET /api/events/live is a long-lived Server-Sent Events stream
    # (the Live MQTT tile's replacement -- see MAINTENANCE.md). nginx
    # buffers a proxied response by default, which would sit on every
    # event until the buffer filled instead of flushing it to the browser
    # immediately -- exactly defeating the point of "live." Same
    # cabin-backend upstream as /api/ above, just with buffering off for
    # this one path; everything else is unaffected.
    location /api/events/live {
        proxy_pass http://cabin-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy /actuator/* to the backend
    location /actuator/ {
        proxy_pass http://cabin-backend:8090;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
