server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # All routes fall through to index.html (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the Spring Boot backend
    location /api/ {
        proxy_pass http://cabin-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /actuator/* to the backend
    location /actuator/ {
        proxy_pass http://cabin-backend:8090;
        proxy_set_header Host $host;
    }

    # Found 2026-09-13: the Live MQTT tile (Monitoring panel) connects
    # directly to ws://100.77.44.113:9001 (mosquitto's raw Tailscale-IP
    # WebSocket listener, added 2026-08-08 back when this app was
    # Tailscale-only) -- now that cabin-ui is served over HTTPS publicly
    # through Cloudflare Tunnel, browsers hard-block that as mixed
    # content (a plain ws:// connection from an https:// page), so the
    # tile has silently shown nothing for every public visitor since.
    # Fixed by terminating the WebSocket here instead, same-origin, so
    # the browser only ever sees wss://cabin.<domain>/mqtt-ws.
    #
    # cabin-ui and mosquitto sit on two different Docker networks on the
    # M920q (infra_default vs cabin_default) -- can't proxy_pass to the
    # "mosquitto" hostname the way /api/ above reaches cabin-backend.
    # Reached via the M920q's own LAN IP instead, the same pattern
    # cabin-backend already uses to reach Home Assistant across the same
    # cross-project network gap (HA_URL: http://192.168.2.46:8123 in
    # docker-compose.m920q.yml) -- not a new workaround, an established one.
    location /mqtt-ws {
        proxy_pass http://192.168.2.46:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
