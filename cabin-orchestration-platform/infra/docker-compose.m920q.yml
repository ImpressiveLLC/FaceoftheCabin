# M920q Cabin Hub overlay
#
# Existing cabin stack (at /storage/containers/compose/cabin/) runs:
#   mosquitto (1883), homeassistant (host network/8123), nodered (1880),
#   frigate (5000), zigbee2mqtt (8080), homepage (3000),
#   uptime-kuma (3001), mediamtx, blinkbridge
# All on the Docker network: cabin_default
#
# This overlay:
#   - Disables FaceoftheCabin services that conflict with the existing stack
#   - Fixes Kafka advertised listener for container-to-container use
#   - Shifts Grafana to port 3002 (3000=homepage, 3001=uptime-kuma)
#   - Adds cabin-backend (port 8090) joined to cabin_default to reach mosquitto
#   - Adds cabin-ui (port 4080) with Tailscale IPs baked into the build
#
# Usage (from cabin-orchestration-platform/infra/):
#   cp .env.m920q.example ../.env   # fill in HA_TOKEN and passwords
#   docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d --build
#
# Dashboard: http://100.77.44.113:4080  (Tailscale or LAN)
# Backend:   http://100.77.44.113:8090/actuator/health

services:

  # ── Disabled — already running in the existing cabin stack ────────────
  mqtt:
    profiles: [disabled]

  homeassistant:
    profiles: [disabled]

  nodered:
    profiles: [disabled]

  frigate:
    profiles: [disabled]

  watchdog:
    profiles: [disabled]

  # ── Fix Kafka advertised listener for container networking ────────────
  # Base compose advertises localhost:9092 which breaks container clients.
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cabin-kafka:9092

  # ── Grafana: disable base (ports merge, not replace) then redefine ────
  # Docker Compose merges ports arrays across files so the override port
  # doesn't replace 3000 — it adds to it, causing a conflict with homepage.
  # Solution: disable the base service and define cabin-grafana separately.
  grafana:
    profiles: [disabled]

  cabin-grafana:
    image: grafana/grafana:latest
    container_name: cabin-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cabin_grafana}
      GF_SECURITY_ALLOW_EMBEDDING: "true"   # required for iframe embed in cabin-ui
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3002:3000"
    volumes:
      - cabin_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - default
    depends_on:
      - postgres

  # ── FaceoftheCabin Spring Boot backend ───────────────────────────────
  cabin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cabin-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
      MQTT_URL: tcp://mosquitto:1883        # reach existing mosquitto via cabin_default
      HA_URL: http://192.168.2.46:8123      # HA on host network — use LAN IP
      HA_TOKEN: ${HA_TOKEN:-}
      HOME_HA_URL: ${HOME_HA_URL:-http://home-hub:8123}
      HOME_HA_TOKEN: ${HOME_HA_TOKEN:-}
      KAFKA_BOOTSTRAP: cabin-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://cabin-postgres:5432/cabin
    networks:
      - default         # project network: reaches cabin-postgres, cabin-kafka
      - cabin_default   # existing network: reaches mosquitto, nodered, z2m
    depends_on:
      - postgres
      - kafka

  # ── Smrekar Family Hub (nginx, static files) ─────────────────────────
  family-hub:
    build:
      context: ../../family-hub
      dockerfile: Dockerfile
    container_name: family-hub
    restart: unless-stopped
    ports:
      - "4081:80"
    networks:
      - default

  # ── FaceoftheCabin React UI (nginx, static build) ────────────────────
  cabin-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        VITE_CABIN_API_BASE: http://100.77.44.113:8090
        VITE_CABIN_WS_BASE: ws://100.77.44.113:9001
        VITE_CABIN_GRAFANA_URL: http://100.77.44.113:3002
        VITE_CABIN_NODERED_URL: http://100.77.44.113:1880
        VITE_CABIN_FRIGATE_URL: http://100.77.44.113:5000
        VITE_CABIN_HA_URL: http://100.77.44.113:8123
        VITE_CABIN_Z2M_URL: http://100.77.44.113:8080
        VITE_CABIN_FAMILY_HUB_URL: ${FAMILY_HUB_URL:-http://100.77.44.113:4081}
    container_name: cabin-ui
    restart: unless-stopped
    ports:
      - "4080:80"
    networks:
      - default
    depends_on:
      - cabin-backend

networks:
  cabin_default:
    external: true
    name: cabin_default   # the network all existing cabin containers share
