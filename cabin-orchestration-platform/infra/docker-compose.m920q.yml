# M920q Cabin Hub overlay
#
# Existing cabin stack (at /storage/containers/compose/cabin/) runs:
#   mosquitto (1883), homeassistant (host network/8123), nodered (1880),
#   frigate (5000), zigbee2mqtt (8080), homepage (3000),
#   uptime-kuma (3001), mediamtx, blinkbridge
# All on the Docker network: cabin_default
#
# This overlay:
#   - Disables FaceoftheCabin services that conflict with the existing stack
#   - Fixes Kafka advertised listener for container-to-container use
#   - Shifts Grafana to port 3002 (3000=homepage, 3001=uptime-kuma)
#   - Adds cabin-backend (port 8090) joined to cabin_default to reach mosquitto
#   - Adds cabin-ui (port 4080) with Tailscale IPs baked into the build
#
# Usage (from cabin-orchestration-platform/infra/):
#   cp .env.m920q.example ../.env   # fill in HA_TOKEN and passwords
#   docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d --build
#
# Dashboard: http://100.77.44.113:4080  (Tailscale or LAN)
# Backend:   http://100.77.44.113:8090/actuator/health

services:

  # ── Disabled — already running in the existing cabin stack ────────────
  mqtt:
    profiles: [disabled]

  homeassistant:
    profiles: [disabled]

  nodered:
    profiles: [disabled]

  frigate:
    profiles: [disabled]

  watchdog:
    profiles: [disabled]

  # ── Fix Kafka advertised listener for container networking ────────────
  # Base compose advertises localhost:9092 which breaks container clients.
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cabin-kafka:9092

  # ── Grafana: disable base (ports merge, not replace) then redefine ────
  # Docker Compose merges ports arrays across files so the override port
  # doesn't replace 3000 — it adds to it, causing a conflict with homepage.
  # Solution: disable the base service and define cabin-grafana separately.
  grafana:
    profiles: [disabled]

  cabin-grafana:
    image: grafana/grafana:latest
    container_name: cabin-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cabin_grafana}
      GF_SECURITY_ALLOW_EMBEDDING: "true"   # required for iframe embed in cabin-ui
      # Found 2026-08-03 (user report: "won't load off Tailscale"):
      # %(domain)s and %(http_port)s in root_url are template variables
      # Grafana fills from its OWN [server] domain/http_port settings --
      # neither was ever set here, so they defaulted to domain=localhost
      # and http_port=3000 (Grafana's internal container port, with no
      # idea this host remaps it to 3002). Every request to the real,
      # externally-reachable address (any browser, Tailscale or not) got
      # redirected to http://localhost:3000/grafana/ -- "localhost" on
      # the VIEWER'S OWN machine, which obviously has nothing listening
      # there. Not a network/firewall/Tailscale problem at all -- curl
      # reached cabin-grafana over the Tailscale IP just fine; only the
      # redirect Location header was wrong. Fixed by making root_url
      # fully explicit instead of template-substituted.
      GF_SERVER_ROOT_URL: "http://${GRAFANA_EXTERNAL_HOST:-100.77.44.113}:3002/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # grafana/provisioning/datasources/timescale.yml references
      # ${POSTGRES_PASSWORD} for the CabinDB datasource, but this container
      # never actually received that env var — found 2026-08-02 while
      # rotating the cabin-postgres password. Grafana only expands env vars
      # in provisioning YAML that are present in ITS OWN container
      # environment, not just anywhere in the compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
    ports:
      - "3002:3000"
    volumes:
      - cabin_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - default
    depends_on:
      - postgres

  # ── FaceoftheCabin Spring Boot backend ───────────────────────────────
  cabin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cabin-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
      MQTT_URL: tcp://mosquitto:1883        # reach existing mosquitto via cabin_default
      HA_URL: http://192.168.2.46:8123      # HA on host network — use LAN IP
      HA_TOKEN: ${HA_TOKEN:-}
      HOME_HA_URL: ${HOME_HA_URL:-http://home-hub:8123}
      HOME_HA_TOKEN: ${HOME_HA_TOKEN:-}
      KAFKA_BOOTSTRAP: cabin-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://cabin-postgres:5432/cabin
      # Same Web Client ID family-hub signs in with (see family-hub's
      # GOOGLE_CLIENT_ID below) — GoogleAuthInterceptor checks the "aud"
      # claim on tokens sent to /api/notes and /api/chores against this, so
      # a token from an unrelated Google app can't be used to write here.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Tech ID Service findings-submission key -- optional, empty by
      # default (submission returns 503 until an operator sets this).
      # See docs/REPLICATION.md §8.
      TECH_ID_API_KEY: ${TECH_ID_API_KEY:-}
    volumes:
      # Read-only mount so OntologyLookupService can resolve entity ids to
      # display names for the Opportunity Map (and future data-dictionary
      # UI) without baking docs/ into the image -- the build context is
      # ../backend only. See OntologyLookupService's javadoc.
      - ../../docs:/app/docs:ro
    networks:
      - default         # project network: reaches cabin-postgres, cabin-kafka
      - cabin_default   # existing network: reaches mosquitto, nodered, z2m
    depends_on:
      - postgres
      - kafka

  # ── Smrekar Family Hub (nginx, static files) ─────────────────────────
  family-hub:
    build:
      context: ../../family-hub
      dockerfile: Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        ADMIN_EMAILS: ${ADMIN_EMAILS:-}
        CABIN_API_URL: ${CABIN_API_URL:-https://api.unicornpingpong.com}
    container_name: family-hub
    restart: unless-stopped
    ports:
      - "4081:80"
    networks:
      - default

  # ── FaceoftheCabin React UI (nginx, static build) ────────────────────
  cabin-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Public now (api.unicornpingpong.com — needs a Cloudflare Tunnel
        # public hostname route added manually, see docs/EXECUTION_PLAN_2026-07-30.md /
        # session notes; cloudflared here is token-managed, not a local
        # config file this repo can drive). Core device list/status and the
        # Family Hub link both need this to work for a non-Tailscale visitor.
        VITE_CABIN_API_BASE: ${CABIN_API_URL:-https://api.unicornpingpong.com}
        # Left Tailscale-only deliberately: raw MQTT pub/sub (device control
        # channel, not just viewing), and every embed below is a direct
        # admin/reconfiguration surface (Node-RED flow editor, Frigate NVR
        # admin, full Home Assistant admin, Zigbee2MQTT admin) — a
        # meaningfully different risk than the read-only status/link-out
        # this round is actually about. Those specific panels just won't
        # load for a non-Tailscale visitor; the rest of the app is
        # unaffected. Revisit only if that's explicitly wanted too.
        VITE_CABIN_WS_BASE: ws://100.77.44.113:9001
        VITE_CABIN_GRAFANA_URL: http://100.77.44.113:3002
        VITE_CABIN_NODERED_URL: http://100.77.44.113:1880
        VITE_CABIN_FRIGATE_URL: http://100.77.44.113:5000
        VITE_CABIN_HA_URL: http://100.77.44.113:8123
        VITE_CABIN_Z2M_URL: http://100.77.44.113:8080
        VITE_CABIN_FAMILY_HUB_URL: ${FAMILY_HUB_URL:-https://hub.unicornpingpong.com}
        # Same Web-application OAuth client family-hub uses (see that
        # service's GOOGLE_CLIENT_ID above) — needs
        # cabin.unicornpingpong.com added as an authorized JS origin on
        # that same Google Cloud client, a manual one-time step.
        VITE_CABIN_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: cabin-ui
    restart: unless-stopped
    ports:
      - "4080:80"
    networks:
      - default
    depends_on:
      - cabin-backend

networks:
  cabin_default:
    external: true
    name: cabin_default   # the network all existing cabin containers share
