# M920q Cabin Hub overlay
#
# The M920q already runs a separate Docker project with:
#   mosquitto (1883), homeassistant (host/8123), nodered (1880),
#   frigate (5000), zigbee2mqtt (8080), homepage (3000),
#   uptime-kuma (3001), mediamtx (8554/8888/8889/9997)
#
# This overlay:
#   - Disables FaceoftheCabin services that would conflict
#   - Shifts Grafana to port 3002 (3000=homepage, 3001=uptime-kuma)
#   - Adds the FaceoftheCabin backend (port 8090) and UI (port 4080)
#   - Starts only Postgres and Kafka from the base stack
#
# Usage (from infra/ directory):
#   cp .env.m920q.example .env   # fill in secrets first
#   docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d --build
#
# Dashboard available at: http://100.77.44.113:4080  (or via Tailscale)

services:

  # ── Disabled — already running as separate containers ──────────
  mqtt:
    profiles: [disabled]

  homeassistant:
    profiles: [disabled]

  nodered:
    profiles: [disabled]

  frigate:
    profiles: [disabled]

  watchdog:
    profiles: [disabled]

  # ── Grafana shifted to 3002 (3000 = homepage, 3001 = uptime-kuma) ─
  grafana:
    ports:
      - "3002:3000"

  # ── FaceoftheCabin Spring Boot backend ────────────────────────
  cabin-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cabin-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabin_dev_password}
      MQTT_URL: tcp://mosquitto:1883         # existing mosquitto container
      HA_URL: http://172.17.0.1:8123         # HA on host network — reach via Docker bridge gateway
      HA_TOKEN: ${HA_TOKEN:-}
      HOME_HA_URL: ${HOME_HA_URL:-http://home-hub:8123}
      HOME_HA_TOKEN: ${HOME_HA_TOKEN:-}
      KAFKA_BOOTSTRAP: cabin-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://cabin-postgres:5432/cabin
    networks:
      - cabin_net
      - mosquitto_net    # attach to existing mosquitto network
    depends_on:
      - postgres
      - kafka

  # ── FaceoftheCabin React UI (nginx, built from source) ────────
  cabin-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        VITE_CABIN_API_BASE: http://100.77.44.113:8090
        VITE_CABIN_WS_BASE: ws://100.77.44.113:9001
        VITE_CABIN_GRAFANA_URL: http://100.77.44.113:3002
        VITE_CABIN_NODERED_URL: http://100.77.44.113:1880
        VITE_CABIN_FRIGATE_URL: http://100.77.44.113:5000
    container_name: cabin-ui
    restart: unless-stopped
    ports:
      - "4080:80"
    networks:
      - cabin_net
    depends_on:
      - cabin-backend

networks:
  cabin_net:
    driver: bridge
  mosquitto_net:
    external: true        # name of the network mosquitto container is on
    name: mosquitto_default
