
services:

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    restart: unless-stopped

    volumes:
      - /storage/services/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: unless-stopped

    ports:
      - "9001:9001"
      - "1883:1883"

    volumes:
      - /storage/services/mosquitto/config:/mosquitto/config
      - /storage/services/mosquitto/data:/mosquitto/data
      - /storage/services/mosquitto/log:/mosquitto/log

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mediamtx:
    container_name: mediamtx
    image: bluenviron/mediamtx:latest
    restart: unless-stopped

    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"

    volumes:
      - /storage/services/mediamtx/mediamtx.yml:/mediamtx.yml

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    shm_size: "512mb"
    restart: unless-stopped

    ports:
      - "5000:5000"
      - "8555:8555/tcp"
      - "8555:8555/udp"

    volumes:
      - /storage/services/frigate:/config
      - /storage/cameras/frigate:/media/frigate
      - /var/lib/frigate-cache:/tmp/cache
      - /etc/localtime:/etc/localtime:ro

    environment:
      FRIGATE_RTSP_PASSWORD: ""
      CAMERA_PASSWORD: "${CAMERA_PASSWORD}"

    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "10"

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    restart: unless-stopped

    ports:
      - "3001:3001"

    volumes:
      - /storage/services/uptime-kuma:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "100.77.44.113:3000,192.168.1.143:3000,localhost:3000"
    ports:
      - "3000:3000"
    volumes:
      - /storage/services/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  blinkbridge:
    container_name: blinkbridge
    build:
      context: /storage/services/blinkbridge-src
    restart: unless-stopped

    env_file:
      - .env

    environment:
      BLINK_USERNAME: ${BLINK_USERNAME}
      BLINK_PASSWORD: ${BLINK_PASSWORD}
      MEDIAMTX_URL: rtsp://mediamtx:8554
      BLINKBRIDGE_CONFIG: /config/config.json

    volumes:
      - /storage/services/blinkbridge:/config
      - /storage/cameras/blinkbridge:/working

    depends_on:
      - mediamtx

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - /storage/services/nodered:/data

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /storage/services/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_8224d99c690ff011b85da19a41f80dde-if00-port0:/dev/ttyACM0
    environment:
      - TZ=America/Chicago
