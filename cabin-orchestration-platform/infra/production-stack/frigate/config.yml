# Frigate NVR configuration
# https://docs.frigate.video
#
# Env var substitution: {VAR} in this file reads from Frigate container environment.
# CAMERA_PASSWORD must be set in infra/.env (copied from .env.m920q.example).
#
# Camera naming, corrected 2026-08-02 (was wrong before this): both real
# cameras below physically sit next to the front door and cover the
# driveway area from slightly different angles -- there is no third,
# separate "front door camera" (the old disabled front_door stanza at
# .201 was based on a mistaken assumption that one existed and was "not
# yet purchased"; it never did, front-door coverage was already handled
# by these two). Renamed to reflect that:
#   front_door → 192.168.2.200  (Reolink RLC-820A) -- was named "driveway"
#     (since 2026-09-30 this camera is cabin_outside_reolink at 192.168.1.121,
#      see its block below; the line above is the 2026-08-02 naming history)
#   driveway   → Blink "Outdoor 4 - DHEE" via blinkbridge -- was named "outdoor_4"
# Neither name is device-preferential; they're just the two available
# semantic slots for "covers the front door / driveway area," reassigned
# to the real two devices instead of a name assuming a non-existent third
# camera. One of these two will eventually be relocated to cover the rear
# of the building instead (not yet — user confirmed 2026-08-02, no ETA).
#
# RTSP URL format for Reolink:
#   main stream: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@<IP>:554/h264Preview_01_main
#   sub  stream: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@<IP>:554/h264Preview_01_sub
#   Use sub for detect (640x480, low CPU), main for record (4K).
#   cabin_outside_reolink actually runs on /Preview_01_sub at 640x360.

mqtt:
  host: mosquitto
  port: 1883
  topic_prefix: cabin/camera
  client_id: frigate

# Object tracking + alert labels expanded 2026-08-03 at the user's request
# (person/car alone -> also vehicles and larger animals, for real overnight
# security alerting). Confirmed via Frigate's installed source
# (frigate/config/camera/review.py) that AlertsConfig.labels defaults to
# DEFAULT_ALERT_OBJECTS = ["person", "car"] specifically -- NOT derived
# from objects.track -- so both objects.track (what gets detected at all)
# and review.alerts.labels (what counts as an "alert", the higher-
# significance review tier) need to be set explicitly, not just the
# former. No "deer" label exists in the default COCO-based model -- the
# closest available large-animal labels are bear/dog/cat/cow/horse/sheep;
# flagged to the user directly, not silently worked around.
review:
  alerts:
    labels:
      - person
      - car
      - bicycle
      - motorcycle
      - truck
      - bus
      - bear
      - dog
      - cat

cameras:

  # The Reolink RLC-820A. Named front_door at 192.168.2.200 until 2026-09-30;
  # since then cabin_outside_reolink at 192.168.1.121, reached through the
  # M920q's Ethernet port eno2 (cabled to the Starlink router's
  # 192.168.1.0/24 side). The key is settled as cabin_outside_reolink: it is
  # the key recordings have been filed under since 2026-09-30 and renaming it
  # back would split the camera's history. (W-39; Cowork, HO-2026-10-04.)
  #
  # Brought under git from the live hand edit of 2026-09-30, with these
  # deliberate differences from what was running:
  #   * detect.enabled: true and snapshots.enabled: true. The hand-written block
  #     had neither, and Frigate 0.17 defaults detection OFF and tracks only
  #     person, so the camera recorded continuously but ran no object detection
  #     (detection_fps 0.0, no events) and kept no snapshots.
  #   * objects.track is the same list every other camera here tracks (Cowork
  #     Q3). Detector cost is per frame, not per class; the extra cost is
  #     events and snapshot storage, which the retention settings below govern.
  #   * the camera password is the {FRIGATE_RTSP_PASSWORD} placeholder, not a
  #     literal. THE LIVE FILE'S LITERAL DIFFERS FROM THE VAULT-FED VALUE, so
  #     do not merge this until Nate has aligned the vault and infra/.env with
  #     the working credential (W-39). Merging before that takes the camera dark.
  #
  # KNOWN RISK: 192.168.1.121 comes from the Starlink router's DHCP. A
  # reservation for it is not known to exist, so if the address changes Frigate
  # loses the camera. Record here how it is kept stable, or that it is not.
  #
  # Kept as it was running (verified working at about 5 fps): the sub-stream
  # path /Preview_01_sub (git's old block used /h264Preview_01_sub), the
  # 640x360 detect size, and an empty hwaccel_args (no hardware acceleration
  # for this camera). Motion sensitivity is NOT tuned here: that waits for a 24 h
  # baseline of detection at default sensitivity (W-5), then its own PR.
  cabin_outside_reolink:
    enabled: true
    ffmpeg:
      inputs:
        # Sub-stream: low-res, used for detection (saves CPU)
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.121:554/Preview_01_sub
          roles:
            - detect
        # Main stream: 4K, used for recording
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.121:554/h264Preview_01_main
          roles:
            - record
      hwaccel_args: []
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    motion:
      mask: []   # polygon coordinates can exclude areas (road, trees) later
    objects:
      track:
        - person
        - car
        - bicycle
        - motorcycle
        - truck
        - bus
        - bear
        - dog
        - cat

  # Blink "Outdoor 4 - DHEE" via blinkbridge -> mediamtx RTSP relay. Never
  # configured here before 2026-08-02, despite blinkbridge already running
  # for weeks -- the bridge had a stream to offer but nothing was consuming
  # it. Not a native RTSP camera: Blink has no local live stream, so this
  # is a synthetic feed blinkbridge builds from Blink's own cloud motion
  # clips. It's only "live" when Blink's cloud already detected motion, not
  # a continuous 24/7 feed like the Reolink camera above -- Frigate's
  # detection here is a second, finer-grained pass (person/car) on top of
  # Blink's own coarser motion trigger, not a replacement for it. Only one
  # stream is available (no separate low-res sub-stream like the Reolink
  # gets), so it's used for both roles. Real resolution confirmed via
  # ffprobe against the live stream, not assumed.
  #
  # Named "driveway" as of 2026-08-02 (was "outdoor_4") -- see the header
  # comment above for why. "outdoor_4"/"DHEE" is Blink's own internal
  # device name, never a meaningful semantic name for this platform.
  driveway:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/outdoor_4_-_dhee
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track:
        - person
        - car
        - bicycle
        - motorcycle
        - truck
        - bus
        - bear
        - dog
        - cat

  # 2026-08-15: AldrichFront, a Home-location camera on the same Blink
  # account/sync module as "driveway" above -- same relay pattern (Blink
  # has no local live stream; blinkbridge builds this feed from Blink's
  # own cloud motion clips, so it's only "live" when Blink already
  # detected motion, not continuous), and per the user this is the same
  # physical camera model as "driveway", so the same 1280x720 detect
  # resolution is a reasoned assumption, not a blind guess -- reconfirm
  # via ffprobe against the real stream once it's actually flowing, same
  # as "driveway"'s own comment already asks for that camera. Path
  # "aldrichfront" matches blinkbridge's own slugification exactly
  # (camera_name.lower().replace(' ', '_') on "AldrichFront" -> no spaces
  # to replace -- confirmed directly against blinkbridge's installed
  # source, blink.py/stream_server.py, not assumed). home_ prefix matches
  # MqttBridgeService.deriveCameraLocation()'s existing convention for
  # tagging a camera as Home rather than Cabin. Retention/pre-post-capture
  # inherited from the top-level record: block below, same as every other
  # camera here -- no per-camera override needed.
  #
  # Known issue, NOT fixed by adding this block: blinkbridge's own
  # clip/thumbnail fetch for AldrichFront is currently failing (42
  # consecutive failures, 15-minute backoff loop, confirmed live in
  # blinkbridge's logs 2026-08-15) -- the same Blink account's other
  # camera ("Outdoor 4 - DHEE" / driveway) is unaffected, so this looks
  # camera-specific, not an account-wide auth/rate-limit problem. This
  # camera existing here makes the "watch live"/clip UI possible at all;
  # it doesn't make blinkbridge's own fetch succeed. See blinkbridge's
  # own repo (main.py:298, camera.py:365) for that separate fix.
  home_aldrich_front:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/aldrichfront
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track:
        - person
        - car
        - bicycle
        - motorcycle
        - truck
        - bus
        - bear
        - dog
        - cat

detectors:
  cpu1:
    type: cpu
    num_threads: 2

record:
  enabled: true
  # Phase 6 camera video viewing, 2026-08-02 -- pre/post capture widened
  # from Frigate's 5s/5s default per the user's explicit request ("events
  # minus 15 seconds and post event of one minute"). Continuous (24/7)
  # recording enabled with a short 5-day retention, deliberately
  # conservative: cabin_outside_reolink's record role uses its 4K main stream (see
  # the camera comment above), which at realistic 4K bitrates could hit
  # 80-160+ GB/day once that camera is back online (it has been since
  # 2026-09-30) -- 826GB free as of this change, confirmed via a df -h
  # check immediately before this edit. Re-measure real GB/day once
  # cabin_outside_reolink's recordings have a few days of history and extend retention only after confirming
  # actual usage, not this estimate. driveway (Blink) is motion-gated at
  # the source (see its own comment above) so continuous.days barely
  # matters for it -- there's no true 24/7 stream to continuously record
  # in the first place, only whatever segments Blink's cloud already
  # triggered.
  alerts:
    pre_capture: 15
    post_capture: 60
  detections:
    pre_capture: 15
    post_capture: 60
  continuous:
    days: 5

snapshots:
  enabled: true

version: 0.17-0
classification:
  custom:
    Person On Foot:
      enabled: true
      name: Person On Foot
      threshold: 0.8
      object_config:
        objects:
          - person
          - animal
          - car
        classification_type: attribute
