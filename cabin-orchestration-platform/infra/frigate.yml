# Frigate NVR configuration
# https://docs.frigate.video
#
# Env var substitution: {VAR} in this file reads from Frigate container environment.
# CAMERA_PASSWORD must be set in infra/.env (copied from .env.m920q.example).
#
# Camera static IPs (set on each camera via Reolink app before deploying):
#   driveway  → 192.168.2.200  (Reolink RLC-820A)
#   front_door → 192.168.2.201  (not yet purchased)
#
# RTSP URL format for Reolink:
#   main stream: rtsp://admin:{CAMERA_PASSWORD}@<IP>:554/h264Preview_01_main
#   sub  stream: rtsp://admin:{CAMERA_PASSWORD}@<IP>:554/h264Preview_01_sub
#   Use sub for detect (640x480, low CPU), main for record (4K).

mqtt:
  host: cabin-mqtt
  port: 1883
  topic_prefix: cabin/camera
  client_id: frigate

cameras:

  driveway:
    enabled: true
    ffmpeg:
      inputs:
        # Sub-stream: low-res, used for motion detection (saves CPU)
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.200:554/h264Preview_01_sub
          roles:
            - detect
        # Main stream: 4K, used for recording
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.200:554/h264Preview_01_main
          roles:
            - record
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    record:
      enabled: true
      retain:
        days: 7
        mode: motion
    snapshots:
      enabled: true
      retain:
        default: 7
    objects:
      track:
        - person
        - car

  front_door:
    enabled: false   # camera not yet installed
    ffmpeg:
      inputs:
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.201:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://admin:{CAMERA_PASSWORD}@192.168.2.201:554/h264Preview_01_main
          roles:
            - record
    detect:
      enabled: false
      width: 640
      height: 480
      fps: 5
    record:
      enabled: false

detectors:
  cpu1:
    type: cpu
    num_threads: 2

record:
  enabled: true
  retain:
    days: 7
    mode: motion

snapshots:
  enabled: true
  retain:
    default: 7

version: 0.17-0
