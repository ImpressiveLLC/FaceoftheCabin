input_boolean:
  cabin_security_armed_away:
    name: Cabin Security Armed Away
    icon: mdi:shield-home

automation:
  - id: cabin_security_publish_arm_state
    alias: Cabin Security - Publish Arm Away State
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.cabin_security_armed_away
    actions:
      - action: mqtt.publish
        data:
          topic: cabin/security/armed_away
          payload: "{{ 'ON' if is_state('input_boolean.cabin_security_armed_away', 'on') else 'OFF' }}"
          qos: 1
          retain: true

  - id: cabin_security_publish_nate_presence
    alias: Cabin Security - Publish Nate Presence
    mode: restart
    triggers:
      - trigger: state
        entity_id: person.natecabin
    conditions:
      - condition: template
        value_template: "{{ states('person.natecabin') in ['home', 'not_home'] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: cabin/presence/nate
          payload: "{{ states('person.natecabin') }}"
          qos: 1
          retain: true

  - id: cabin_security_publish_state_at_startup
    alias: Cabin Security - Publish State At Startup
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:05"
      - action: mqtt.publish
        data:
          topic: cabin/security/armed_away
          payload: "{{ 'ON' if is_state('input_boolean.cabin_security_armed_away', 'on') else 'OFF' }}"
          qos: 1
          retain: true
      - if:
          - condition: template
            value_template: "{{ states('person.natecabin') in ['home', 'not_home'] }}"
        then:
          - action: mqtt.publish
            data:
              topic: cabin/presence/nate
              payload: "{{ states('person.natecabin') }}"
              qos: 1
              retain: true
