# DEPLOYMENT PATH, confirmed live 2026-09-05 (a real deploy blocker that
# cost real debugging time -- don't repeat it): this file's source of
# truth is here in git, but the M920q's actual Home Assistant only loads
# packages from its own /config/packages/ directory
# (homeassistant.packages: !include_dir_named packages in
# configuration.yaml). The live copy lives at
# /config/packages/cabin_security.yaml INSIDE the homeassistant container
# -- copying an updated version of this file to /config/cabin_security.yaml
# (the container's config root) silently does nothing; HA never reads it
# from there. Always copy into /config/packages/ and `docker restart
# homeassistant` to pick up changes.
input_boolean:
  cabin_security_armed_away:
    name: Cabin Security Armed Away
    icon: mdi:shield-home

shell_command:
  cabin_security_publish: >-
    python /config/cabin_security_mqtt_publish.py "{{ topic }}" "{{ payload }}"

automation:
  - id: cabin_security_publish_arm_state
    alias: Cabin Security - Publish Arm Away State
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.cabin_security_armed_away
    actions:
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/security/armed_away
          payload: "{{ 'ON' if is_state('input_boolean.cabin_security_armed_away', 'on') else 'OFF' }}"

  - id: cabin_security_publish_nate_presence
    alias: Cabin Security - Publish Nate Presence
    mode: restart
    triggers:
      - trigger: state
        entity_id: person.natecabin
    conditions:
      - condition: template
        value_template: "{{ states('person.natecabin') in ['home', 'not_home'] }}"
    actions:
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/presence/nate
          payload: "{{ states('person.natecabin') }}"

  # Added 2026-08-21 -- real push bridge for docs/ontology.yaml's
  # trigger_kidde_co_alarm (cabin-orchestration-platform's Part E).
  # entity_id confirmed live against the M920q's own
  # .storage/core.entity_registry directly (platform kidde_homesafe) --
  # NOT binary_sensor.kidde_air_quality_alarm_carbon_monoxide_alarm, an
  # older, separate mqtt-platform entity fed by the orphaned retained
  # message docs/ontology.yaml's smart_appliance_co_air_quality_kidde
  # notes already document as dead (frozen since 2026-07-03, nothing
  # publishes to it).
  - id: cabin_security_publish_kidde_co_alarm
    alias: Cabin Security - Publish Kidde CO Alarm
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.living_room_kidde_co_temp_and_humidity_cabin_upstairs_co_alarm
    actions:
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/kidde/co_alarm
          payload: "{{ 'ON' if is_state('binary_sensor.living_room_kidde_co_temp_and_humidity_cabin_upstairs_co_alarm', 'on') else 'OFF' }}"

  # Added 2026-09-05 -- replaces the phone-side MacroDroid listener
  # (adware-driven, required watching ads to keep working) that used to
  # call BlinkMotionWebhookController's HTTP endpoint directly. Source:
  # the HA Companion App's own "Last Notification" sensor -- enabled via
  # the Companion App's own Manage Sensors -> Last Notification -> its own
  # Allow list (Blink checked there), with the Companion App itself granted
  # Android's system "Notification access" permission first (a separate
  # screen -- that one lists listener apps like Home Assistant/MacroDroid,
  # never source apps like Blink; Blink only ever appears in HA's own
  # per-sensor allow list, one level deeper).
  #
  # entity_id and every attribute name below are live-verified (Nate's
  # phone, 2026-09-05, Companion App 2026.8.4 -- 2026.6.5 was too old for
  # this sensor to even appear in Manage Sensors at all, a real bug fixed
  # upstream between those versions) against a real Blink motion
  # notification's actual Developer Tools -> States dump, not guessed from
  # docs: the package attribute is the bare `package` key (NOT
  # `android.package`, which doesn't exist), and the real notification text
  # lives in `android.title` ("Motion detected at your AldrichFront.") --
  # `android.text`/`android.subText` were both the literal string "null" on
  # this notification, and `android.bigText` wasn't present at all. Kept as
  # a fallback chain rather than hardcoding to title alone, in case a future
  # Blink app version moves the text elsewhere -- filters out the literal
  # "null" string HA reports for an genuinely-unset attribute so a stale
  # fallback field can never masquerade as real content.
  #
  # KNOWN LIMITATION, confirmed against HA's own GitHub issue tracker: if
  # two notifications from the same app arrive back-to-back with identical
  # text before the first is dismissed, this sensor's state doesn't change
  # and won't re-fire. Blink's real title text has no timestamp in it
  # ("Motion detected at your AldrichFront." -- confirmed live), so two
  # motion events on the same camera within that window IS a real, live
  # gap here, not just theoretical -- accepted for now since MacroDroid's
  # own trigger had no stronger guarantee either, and BlinkLiveviewService's
  # start() being idempotent means a missed second trigger just means no
  # session-restart, not a broken liveview.
  #
  # mode: queued (not restart, unlike every automation above) -- those are
  # ongoing STATE republishers where only the latest value matters; this is
  # a discrete EVENT, so a second motion notification arriving while this
  # is still running must still be processed, not cancelled.
  - id: cabin_security_publish_blink_motion
    alias: Cabin Security - Publish Blink Motion (from phone notification)
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.nates_s23_last_notification
    conditions:
      # Defense in depth -- correct even if the allow list above is ever
      # left broader than just Blink for some other use.
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.get('package') == 'com.immediasemi.android.blink' }}
    actions:
      - variables:
          # Live-verified 2026-09-05: android.title carries the real text
          # ("Motion detected at your AldrichFront."); android.text/
          # android.subText report the literal string "null" (not empty)
          # when unset on this device, which the reject filter below drops
          # so it can never pollute the substring match.
          notification_text: >-
            {% set candidates = [trigger.to_state.attributes.get('android.title', ''),
                                  trigger.to_state.attributes.get('android.text', ''),
                                  trigger.to_state.attributes.get('android.subText', ''),
                                  trigger.to_state.attributes.get('android.bigText', '')] %}
            {{ candidates | reject('equalto', 'null') | reject('equalto', '') | join(' ') }}
      - choose:
          # cameraName "driveway" -> Blink's own device name "Outdoor 4 -
          # DHEE" (see BLINK_CAMERA_MAP in docker-compose.m920q.yml).
          - conditions:
              - condition: template
                value_template: "{{ 'Outdoor 4' in notification_text or 'DHEE' in notification_text }}"
            sequence:
              - action: shell_command.cabin_security_publish
                data:
                  topic: cabin/blink/motion
                  payload: "driveway"
          # cameraName "home_aldrich_front" -> Blink's own device name
          # "AldrichFront".
          - conditions:
              - condition: template
                value_template: "{{ 'AldrichFront' in notification_text }}"
            sequence:
              - action: shell_command.cabin_security_publish
                data:
                  topic: cabin/blink/motion
                  payload: "home_aldrich_front"
        default:
          # Don't silently drop an unmatched Blink notification -- a third
          # camera added later, or a non-motion Blink notification (e.g. a
          # low-battery alert) that this automation was never meant to act
          # on, should be visible for review, not invisible.
          - action: logbook.log
            data:
              name: Cabin Security
              message: >-
                Blink notification didn't match a known camera name: "{{ notification_text }}"

  - id: cabin_security_publish_state_at_startup
    alias: Cabin Security - Publish State At Startup
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:05"
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/security/armed_away
          payload: "{{ 'ON' if is_state('input_boolean.cabin_security_armed_away', 'on') else 'OFF' }}"
      - if:
          - condition: template
            value_template: "{{ states('person.natecabin') in ['home', 'not_home'] }}"
        then:
          - action: shell_command.cabin_security_publish
            data:
              topic: cabin/presence/nate
              payload: "{{ states('person.natecabin') }}"
      # Same startup-republish treatment as armed/presence above -- a
      # retained MQTT value survives HA restarts, but only if something
      # re-asserts it; otherwise a stale reading from before the restart
      # persists indefinitely.
      - if:
          - condition: template
            value_template: "{{ states('binary_sensor.living_room_kidde_co_temp_and_humidity_cabin_upstairs_co_alarm') in ['on', 'off'] }}"
        then:
          - action: shell_command.cabin_security_publish
            data:
              topic: cabin/kidde/co_alarm
              payload: "{{ 'ON' if is_state('binary_sensor.living_room_kidde_co_temp_and_humidity_cabin_upstairs_co_alarm', 'on') else 'OFF' }}"
