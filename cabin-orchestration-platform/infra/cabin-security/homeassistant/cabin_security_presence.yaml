# Nate's WiFi-presence detection for person.natecabin — feeds the
# `cabin/presence/nate` topic that the cabin-security intrusion flow's
# "armed + Nate away" gate depends on (see ../README.md and
# ../nodered/flows.json). Added 2026-08-02 at the user's request: "we
# need to have my phone on the wifi network be my presence."
#
# Router is a Starlink Gen3 gateway with no HA-supported integration, so
# this uses a direct LAN ARP check (check_nate_phone_wifi.sh) via
# command_line rather than a router-specific device_tracker platform —
# HA's nmap_tracker integration would also work but is config-flow-only
# in this HA version (2026.7.0, confirmed via the installed component's
# manifest.json — no YAML path), so it can't be package-managed the same
# way the rest of this repo's HA config is. This stays fully YAML/git
# tracked instead, consistent with that constraint.
#
# Reuses shell_command.cabin_security_publish from cabin_security.yaml
# (same package directory, merged by HA's packages loader) — its
# allow-list already permits exactly `cabin/presence/nate` with
# `home`/`not_home` payloads, so no changes needed there.
#
# Debounce is intentionally ASYMMETRIC: "home" publishes immediately on
# detection, but "not_home" requires 3 continuous minutes of
# non-detection first. The dangerous failure mode here is a false
# "away" while Nate is actually home (armed system + a door event would
# then mean real audible sirens) — a brief WiFi hiccup should never be
# able to cause that. A false "home" (system doesn't arm when it should)
# is the safe-side failure and doesn't need the same protection.

command_line:
  - binary_sensor:
      name: Nate Phone On WiFi
      command: "/config/check_nate_phone_wifi.sh"
      payload_on: "ON"
      payload_off: "OFF"
      command_timeout: 30
      scan_interval: 60

automation:
  - id: cabin_security_publish_nate_presence_from_phone
    alias: Cabin Security - Publish Nate Presence From Phone WiFi
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.nate_phone_on_wifi
        to: "on"
      - trigger: state
        entity_id: binary_sensor.nate_phone_on_wifi
        to: "off"
        for: "00:03:00"
    # W-23: the WiFi check is now the BACKUP signal; the Cabin-zone GPS
    # automation below is primary. A WiFi "off" (not_home) must never override
    # a phone that GPS says is inside the Cabin zone: the phone can drop off
    # WiFi to sleep while still at the cabin, and a false "away" is the
    # dangerous direction for the siren gate. "on" is always published.
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state == 'on'
             or 'zone.cabin' not in (state_attr('device_tracker.nates_s23', 'in_zones') or []) }}
    actions:
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/presence/nate
          payload: "{{ 'home' if trigger.to_state.state == 'on' else 'not_home' }}"

  - id: cabin_security_publish_presence_at_startup
    alias: Cabin Security - Publish Phone-Based Presence At Startup
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:10" # let the first command_line poll complete
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/presence/nate
          # W-23: home if the phone is on the cabin WiFi OR GPS has it inside the
          # Cabin zone. Before this, a restart republished "not_home" over a
          # correct GPS "home".
          payload: >-
            {{ 'home' if (is_state('binary_sensor.nate_phone_on_wifi', 'on')
                          or 'zone.cabin' in (state_attr('device_tracker.nates_s23', 'in_zones') or []))
               else 'not_home' }}

  # W-23 (scope C, Cowork 2026-10-04): Cabin-zone GPS publisher, a copy of
  # home_presence.yaml's House automation keyed to zone.cabin. Nothing
  # published "home" for the cabin from GPS before this: the person-based
  # automation in cabin_security.yaml only publishes when person.natecabin is
  # exactly "home" or "not_home", but inside the Cabin zone the person's state
  # is the zone NAME ("Cabin"), so it never fired. (The cabin signal had been
  # "home" 0 times out of 190 recorded readings.)
  #
  # Same asymmetric debounce as the House automation: "home" publishes
  # immediately, "not_home" needs 3 continuous minutes away (the zone trigger
  # has no `for:`, so the leave branch delays, and mode: restart cancels that
  # pending publish if a fresh "enter" arrives first).
  - id: cabin_presence_publish_nate_presence_from_phone_gps
    alias: Cabin Presence - Publish Nate Presence From Phone GPS Zone
    mode: restart
    triggers:
      - trigger: zone
        entity_id: device_tracker.nates_s23
        zone: zone.cabin
        event: enter
        id: entered
      - trigger: zone
        entity_id: device_tracker.nates_s23
        zone: zone.cabin
        event: leave
        id: left
    actions:
      - if:
          - condition: trigger
            id: left
        then:
          - delay: "00:03:00"
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/presence/nate
          payload: "{{ 'home' if trigger.id == 'entered' else 'not_home' }}"

  # W-23 / W-33 / W-34: phone "last seen" heartbeat. Publishes the time the
  # phone's Companion app last REPORTED to Home Assistant, retained, as
  # cabin/presence/nate/last_seen. The siren gate (W-33) and the hub badge
  # (W-34) use it to tell a stale signal from a current one: presence is only
  # published on change, so the retained value can be days old and still right.
  #
  # Why it polls instead of reacting to the phone (found by simulating this in a
  # real Home Assistant, 2026.7.4):
  #  - Home Assistant refuses automation triggers on `state_reported`
  #    ("Can't listen to state_reported in event trigger"), and template
  #    sensors do not re-render when a sensor re-reports an unchanged value.
  #    A plain state trigger would miss every report where the value did not
  #    change (a phone on a charger at 100% for a night), which would make a
  #    healthy phone look dead.
  #  - So every 5 minutes this reads `last_reported` of the phone's battery
  #    sensor, which the Companion app rewrites on every sensor update.
  #
  # Restart guard: after a Home Assistant restart every restored sensor is
  # rewritten with the restart time, which would make a dead phone look freshly
  # seen. The start-noting automation below records each start in its own
  # `last_triggered`; a heartbeat counts only if last_reported is NEWER than
  # that. After a restart nothing is published until the phone genuinely
  # reports, and the broker keeps the last real timestamp meanwhile. If the
  # noting automation exists but has never run (added by a reload, not a
  # restart) there is no restart to guard against and the check passes.
  #
  # The guard reads the noting automation by its ENTITY id,
  # automation.cabin_presence_note_home_assistant_start, which Home Assistant
  # derives from its ALIAS (not from `id:`). A first version used the `id:` as
  # if it were the entity id; the lookup found nothing and the guard silently
  # let every restart-noise heartbeat through (caught by the simulation). So
  # the guard now FAILS CLOSED: if that entity is missing (e.g. the alias is
  # renamed), no heartbeat is published and the rule shows "unknown age"
  # rather than a falsely fresh one.
  #
  # What is published is the phone's own last_reported time, not "now", so a
  # silent phone's heartbeat does not advance and ages out.
  - id: cabin_presence_note_ha_start
    alias: Cabin Presence - Note Home Assistant Start
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - event: cabin_presence_ha_started

  - id: cabin_presence_publish_nate_last_seen
    alias: Cabin Presence - Publish Phone Last-Seen Heartbeat
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set phone = states.sensor.nates_s23_battery_level %}
          {% set note = states.automation.cabin_presence_note_home_assistant_start %}
          {{ phone is not none
             and note is not none
             and phone.state not in ['unavailable', 'unknown']
             and (note.attributes.last_triggered is none
                  or phone.last_reported > note.attributes.last_triggered) }}
    actions:
      - action: shell_command.cabin_security_publish
        data:
          topic: cabin/presence/nate/last_seen
          payload: "{{ states.sensor.nates_s23_battery_level.last_reported.strftime('%Y-%m-%dT%H:%M:%SZ') }}"
