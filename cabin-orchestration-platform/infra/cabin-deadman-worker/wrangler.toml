# Cloudflare Worker "cabin-deadman" (W-56). Deploy and secrets are done by Nate in the Cloudflare dashboard (or `npx wrangler deploy`).
# No secret values belong in this file: HEARTBEAT_TOKEN and NTFY_TOPIC are Worker secrets.
name = "cabin-deadman"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "HEARTBEAT_KV"
# Create the namespace in the dashboard (Workers & Pages > KV) and put its id here before deploying.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
NTFY_URL = "https://ntfy.sh"
SILENCE_MINUTES = "10"
REPEAT_MINUTES = "60"
