name: Ladder launcher dry-run tests
# Runs scripts/ladder/test_run_ladder.py under pwsh: -DryRun checks (gate arithmetic, fixed docker settings, no real-data
# mount, writes nothing) and the -Run, -Stop, -Verify, -Cleanup and -Preflight flows against a stub host_ops.ps1. Test and
# docs only: no deploy, no host action. The real host operations (WSL, Docker, process stop, power state) are NOT covered.
on:
  pull_request:
    paths:
      - 'scripts/ladder/**'
      - '.github/workflows/ladder-launcher-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ladder/**'
      - '.github/workflows/ladder-launcher-tests.yml'
permissions:
  contents: read
jobs:
  launcher-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the dry-run tests
        run: |
          set -o pipefail
          pwsh -Version
          python -m unittest -v scripts/ladder/test_run_ladder.py 2>&1 | tee "$RUNNER_TEMP/launcher.txt"
          { echo "### Ladder launcher dry-run tests"; tail -n 4 "$RUNNER_TEMP/launcher.txt"; } >> "$GITHUB_STEP_SUMMARY"
