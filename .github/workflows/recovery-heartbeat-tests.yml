name: recovery heartbeat tests
on:
  pull_request:
    paths:
      - 'scripts/host/cabin-recovery-heartbeat*'
      - 'scripts/host/test_cabin_recovery_heartbeat.sh'
      - 'cabin-orchestration-platform/backend/src/main/java/com/cabin/orchestrator/recovery/**'
      - 'cabin-orchestration-platform/backend/src/main/java/com/cabin/orchestrator/alerts/**'
      - 'cabin-orchestration-platform/backend/src/main/java/com/cabin/orchestrator/api/RecoveryController.java'
      - 'cabin-orchestration-platform/backend/src/test/java/com/cabin/orchestrator/recovery/**'
      - 'cabin-orchestration-platform/backend/src/test/java/com/cabin/orchestrator/api/RecoveryControllerTest.java'
      - 'docs/ai-assistant/user-guide/access-and-storage.md'
      - '.github/workflows/recovery-heartbeat-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/host/cabin-recovery-heartbeat*'
      - 'scripts/host/test_cabin_recovery_heartbeat.sh'
      - '.github/workflows/recovery-heartbeat-tests.yml'
permissions:
  contents: read
jobs:
  host-script:
    runs-on: ubuntu-latest   # GitHub-hosted: stand-in docker/curl/systemctl, no production access, no secrets
    steps:
      - uses: actions/checkout@v5
      - name: Recovery heartbeat script tests (state machine, probes, boot check, notices, dead-man)
        run: bash scripts/host/test_cabin_recovery_heartbeat.sh
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recovery tests and the repo-wide guards a new route and bean can trip
        working-directory: cabin-orchestration-platform/backend
        run: mvn -B -ntp test -Dtest='RecoveryHeartbeatServiceTest,RecoveryControllerTest,ActiveAlertServiceTest,DemoAccessTest,WriteGateAuditTest,BeanConstructorGuardTest,RestControllerCorsGuardTest,RoleMatrixTest'
