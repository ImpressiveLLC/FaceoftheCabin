name: Family notes backend PR checks
on:
  pull_request:
    paths: ['cabin-orchestration-platform/backend/**', '.github/workflows/family-notes-backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: cabin-orchestration-platform/backend/pom.xml
      - run: mvn -B test
        working-directory: cabin-orchestration-platform/backend
