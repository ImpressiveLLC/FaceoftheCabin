name: SFT tokenizer and loss-mask tests
# Runs docs/ai-assistant/training/test_sft_tokenize.py: the pinned Ollama-shaped chat template, the assistant-only
# loss mask, control-token injection refusal and the train_sft.py checks, plus test_run_capture.py (the
# run_capture.py Stage 1 tests with a stub trainer). No model or tokenizer download and no training (pip and setup-python still use the network).
# The 5 real-tokenizer tests need the pinned tokenizer.json (SFT_TOKENIZER_JSON) and are SKIPPED here, not passed;
# the summary says so. Training itself stays NOT_RUN and is not started by this workflow.
on:
  pull_request:
    paths:
      - 'docs/ai-assistant/training/*.py'
      - 'docs/ai-assistant/training/requirements.lock'
      - 'docs/ai-assistant/training/requirements.in'
      - 'docs/ai-assistant/training/Dockerfile'
      - '.github/workflows/sft-tokenize-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docs/ai-assistant/training/*.py'
      - 'docs/ai-assistant/training/requirements.lock'
      - 'docs/ai-assistant/training/requirements.in'
      - 'docs/ai-assistant/training/Dockerfile'
      - '.github/workflows/sft-tokenize-tests.yml'
permissions:
  contents: read
jobs:
  sft-tokenize-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the offline SFT tokenizer tests
        working-directory: docs/ai-assistant/training
        run: |
          python -m pip install pytest==8.3.4
          set -o pipefail
          python -m pytest -q -rs test_sft_tokenize.py test_run_capture.py test_verify_run_bundle.py 2>&1 | tee "$RUNNER_TEMP/sft-tests.txt"
      - name: Write the result to the run summary
        if: always()
        run: |
          {
            echo "### SFT tokenizer and loss-mask tests"
            echo ""
            echo "Offline, no model and no training. Real-tokenizer tests are skipped here (they need the pinned tokenizer.json) and are reported as skipped, not passed."
            echo ""
            echo '```'
            tail -n 15 "$RUNNER_TEMP/sft-tests.txt" || echo "no test output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
