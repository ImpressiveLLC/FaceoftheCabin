name: Deploy to host

# Runs on a SELF-HOSTED runner installed on the target machine (e.g. the
# cabin M920q) — see ansible/README.md for one-time setup. This is
# deliberate: the target is Tailscale-only behind CGNAT, so a GitHub-hosted
# runner has no network path to it, and pushing SSH secrets into GitHub for
# a home server is more attack surface than a free/personal-tier project
# needs. The runner polls GitHub over its own outbound Tailscale connection;
# nothing inbound, no secrets stored here.

on:
  push:
    branches: [main]
    paths:
      - "family-hub/**"
      - "cabin-orchestration-platform/**"
      - ".github/workflows/deploy-family-hub.yml"
  workflow_dispatch: {} # manual "run now" button in the Actions tab

jobs:
  deploy:
    # Label set by the runner during registration (ansible/README.md).
    # Add a second label (e.g. "home-hub") and a second runner on the home
    # machine to reuse this same workflow there — see the matrix note below.
    runs-on: [self-hosted, cabin-m920q]
    steps:
      - name: Pull latest
        run: |
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
        env:
          # /opt needs root just to create a directory in — confirmed
          # against the real M920q while setting this up. The repo lives
          # in the deploy user's home instead; the CABIN_REPO_PATH repo
          # variable (Settings -> Secrets and variables -> Actions ->
          # Variables) is the actual source of truth, this is only the
          # fallback if that's ever unset.
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Rebuild and restart family-hub
        run: |
          cd "$DEPLOY_PATH/cabin-orchestration-platform/infra"
          # family-hub has no docker-compose.yml of its own — it's one
          # service inside this project's compose, and the M920q override
          # (docker-compose.m920q.yml) is required: it disables services
          # that conflict with the separately-managed "cabin" stack
          # (HA/mosquitto/nodered/frigate already running there) and
          # remaps ports. Scoped to just the family-hub service — this
          # workflow doesn't touch cabin-backend/cabin-ui/postgres/etc.
          docker compose -f docker-compose.yml -f docker-compose.m920q.yml build family-hub
          docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d family-hub
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Prune old images
        run: docker image prune -f

# ── Template note for a second host (e.g. "home") ──────────────────────────
# Duplicate this file as deploy-home.yml with:
#   - runs-on: [self-hosted, home-hub]
#   - DEPLOY_PATH pointed at the home machine's clone path
#   - paths filter narrowed to locations/home/** if the two hosts should
#     deploy independently of each other's changes
#
# ── Placeholder: web-hosted (non-self-hosted) target ───────────────────────
# If a deployment target is ever a managed platform (Fly.io, Render, a VPS
# with a public IP) instead of a self-hosted box behind Tailscale, this
# workflow's self-hosted-runner assumption doesn't apply — that target
# would use a GitHub-hosted runner + the platform's own deploy action/CLI
# instead (no runner installation needed, since GitHub's runners can reach
# a public host directly). Not built out here since nothing in this
# project targets a web host today; noted so the template doesn't need a
# structural rewrite if that changes.
