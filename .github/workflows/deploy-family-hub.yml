name: Deploy to host

# Runs on a SELF-HOSTED runner installed on the target machine (e.g. the
# cabin M920q) — see ansible/README.md for one-time setup. This is
# deliberate: the target is Tailscale-only behind CGNAT, so a GitHub-hosted
# runner has no network path to it, and pushing SSH secrets into GitHub for
# a home server is more attack surface than a free/personal-tier project
# needs. The runner polls GitHub over its own outbound Tailscale connection;
# nothing inbound, no secrets stored here.

on:
  push:
    branches: [main]
    paths:
      - "family-hub/**"
      - "cabin-orchestration-platform/**"
      - ".github/workflows/deploy-family-hub.yml"
  workflow_dispatch: {} # manual "run now" button in the Actions tab

jobs:
  deploy:
    # Label set by the runner during registration (ansible/README.md).
    # Add a second label (e.g. "home-hub") and a second runner on the home
    # machine to reuse this same workflow there — see the matrix note below.
    runs-on: [self-hosted, cabin-m920q]
    steps:
      - name: Pull latest
        run: |
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
        env:
          # /opt needs root just to create a directory in — confirmed
          # against the real M920q while setting this up. The repo lives
          # in the deploy user's home instead; the CABIN_REPO_PATH repo
          # variable (Settings -> Secrets and variables -> Actions ->
          # Variables) is the actual source of truth, this is only the
          # fallback if that's ever unset.
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Validate Family Hub desktop and mobile journeys
        run: |
          cd "$DEPLOY_PATH/family-hub"
          QA_TAG="family-hub-qa:$(git -C "$DEPLOY_PATH" rev-parse --short HEAD)"
          docker build -f test/Dockerfile -t "$QA_TAG" .

          # Found 2026-08-08: this already gated the deploy (a non-zero
          # exit here stops the job before the rebuild/restart step below
          # ever runs), but results only ever existed in this step's raw
          # console log. Writing a summary to GITHUB_STEP_SUMMARY puts the
          # pass/fail breakdown on the run's Summary page -- one click
          # instead of scrolling a log -- same reasoning as
          # deploy-cabin-backend.yml's mvn test step. set +e/-e is needed
          # since this shell runs with -e by default; letting `docker run`
          # fail unguarded would skip the summary-writing below entirely.
          set +e
          OUTPUT=$(docker run --rm "$QA_TAG" 2>&1)
          TEST_EXIT=$?
          set -e
          echo "$OUTPUT"

          {
            echo "### Family Hub tests (Playwright, \`family-hub/test/run.js\`)"
            echo
            if [ "$TEST_EXIT" -eq 0 ]; then
              echo "**Result: ✅ passed**"
            else
              echo "**Result: ❌ failed (exit $TEST_EXIT) — deploy stopped here**"
            fi
            SUMMARY_LINE=$(echo "$OUTPUT" | grep -E '^[0-9]+ passed' || true)
            if [ -n "$SUMMARY_LINE" ]; then
              echo ""
              echo "$SUMMARY_LINE"
            fi
            FAILURES=$(echo "$OUTPUT" | grep '^FAIL' || true)
            if [ -n "$FAILURES" ]; then
              echo
              echo "**Failed checks:**"
              echo '```'
              echo "$FAILURES"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $TEST_EXIT
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      # Added 2026-08-07 (Phase 7) alongside cabin-ui's first-ever test
      # suite (src/App.test.jsx, src/ThemeProvider.test.jsx) — same
      # "deploy stops here on failure" contract as cabin-backend's `mvn
      # test` step and the Family Hub validation step above it. cabin-ui
      # had zero test coverage or CI gating before this; Vitest was chosen
      # over adding Playwright here since these are pure-function unit
      # tests (isCameraEvent, mergeHubLocations, resolveInitialThemeId),
      # not full-page journeys the way Family Hub's suite is.
      - name: Validate cabin-ui (unit tests)
        run: |
          cd "$DEPLOY_PATH"
          QA_TAG="cabin-ui-qa:$(git rev-parse --short HEAD)"
          # Build context is the repo root, not ui/ -- see
          # cabin-orchestration-platform/ui/test/Dockerfile's comment: the
          # theme-catalog drift check needs family-hub.html reachable too.
          docker build -f cabin-orchestration-platform/ui/test/Dockerfile -t "$QA_TAG" .

          # Same "results belong on the Summary page, not just the raw
          # log" reasoning as the Family Hub step above and
          # deploy-cabin-backend.yml's mvn test step -- see either for the
          # full rationale. set +e/-e guards against this shell's default
          # -e aborting before the summary gets written.
          set +e
          OUTPUT=$(docker run --rm "$QA_TAG" 2>&1)
          TEST_EXIT=$?
          set -e
          echo "$OUTPUT"

          # Vitest's default reporter writes ANSI color codes -- strip them
          # so the summary (rendered as Markdown, not a terminal) is
          # actually readable rather than full of escape-sequence noise.
          CLEAN_OUTPUT=$(echo "$OUTPUT" | sed -E $'s/\x1b\\[[0-9;]*m//g')

          {
            echo "### cabin-ui tests (Vitest)"
            echo
            if [ "$TEST_EXIT" -eq 0 ]; then
              echo "**Result: ✅ passed**"
            else
              echo "**Result: ❌ failed (exit $TEST_EXIT) — deploy stopped here**"
            fi
            SUMMARY_LINES=$(echo "$CLEAN_OUTPUT" | grep -E '^\s*(Test Files|Tests)\s' || true)
            if [ -n "$SUMMARY_LINES" ]; then
              echo
              echo '```'
              echo "$SUMMARY_LINES"
              echo '```'
            fi
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo
              echo "<details><summary>Full test output</summary>"
              echo
              echo '```'
              echo "$CLEAN_OUTPUT"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $TEST_EXIT
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Rebuild and restart family-hub + cabin-ui
        run: |
          cd "$DEPLOY_PATH/cabin-orchestration-platform/infra"
          # Neither service has its own docker-compose.yml — both are
          # services inside this project's compose, and the M920q override
          # (docker-compose.m920q.yml) is required: it disables services
          # that conflict with the separately-managed "cabin" stack
          # (HA/mosquitto/nodered/frigate already running there) and
          # remaps ports. Scoped to these two specifically: both are
          # stateless static builds, safe to rebuild on every relevant
          # push. cabin-backend/postgres/kafka/grafana are deliberately
          # NOT included here — those are stateful/sensitive enough to
          # warrant their own considered rollout, not a blanket rebuild
          # every time anything under cabin-orchestration-platform/** changes.
          docker compose -f docker-compose.yml -f docker-compose.m920q.yml build family-hub cabin-ui
          docker compose -f docker-compose.yml -f docker-compose.m920q.yml up -d family-hub cabin-ui
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Prune old images
        run: docker image prune -f

# ── Template note for a second host (e.g. "home") ──────────────────────────
# Duplicate this file as deploy-home.yml with:
#   - runs-on: [self-hosted, home-hub]
#   - DEPLOY_PATH pointed at the home machine's clone path
#   - paths filter narrowed to locations/home/** if the two hosts should
#     deploy independently of each other's changes
#
# ── Placeholder: web-hosted (non-self-hosted) target ───────────────────────
# If a deployment target is ever a managed platform (Fly.io, Render, a VPS
# with a public IP) instead of a self-hosted box behind Tailscale, this
# workflow's self-hosted-runner assumption doesn't apply — that target
# would use a GitHub-hosted runner + the platform's own deploy action/CLI
# instead (no runner installation needed, since GitHub's runners can reach
# a public host directly). Not built out here since nothing in this
# project targets a web host today; noted so the template doesn't need a
# structural rewrite if that changes.
