name: Rotate cabin-postgres password

# Automatic credential rotation — the "make sure we're refreshing
# automatically" half of the secrets-automation work (see
# docs/ontology.yaml's platform_secret entity, ansible/playbooks/rotate-secrets.yml).
# Runs on the same self-hosted runner as the deploy workflow (see
# deploy-family-hub.yml's header for why self-hosted: Tailscale-only host,
# no inbound path for a GitHub-hosted runner).
#
# Requires Ansible + the vault password file to already exist on the
# runner host — see ansible/README.md's Secrets section for the one-time
# setup (mirrors the runner registration's own one-time, human-run step).

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: {} # manual "run now" button, e.g. right after a suspected leak

jobs:
  rotate:
    runs-on: [self-hosted, cabin-m920q]
    steps:
      - name: Pull latest
        run: |
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}

      - name: Run the rotation playbook
        run: |
          cd "$DEPLOY_PATH/ansible"
          ansible-playbook -i inventory.ini playbooks/rotate-secrets.yml \
            --limit cabin \
            --vault-password-file "$HOME/.ansible_vault_pass"
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin' }}
