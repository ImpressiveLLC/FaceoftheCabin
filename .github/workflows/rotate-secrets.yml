name: Rotate cabin-postgres password

# Automatic credential rotation — the "make sure we're refreshing
# automatically" half of the secrets-automation work (see
# docs/ontology.yaml's platform_secret entity, ansible/playbooks/rotate-secrets.yml).
# Runs on the same self-hosted runner as the deploy workflow (see
# deploy-family-hub.yml's header for why self-hosted: Tailscale-only host,
# no inbound path for a GitHub-hosted runner).
#
# Requires Ansible + the vault password file to already exist on the
# runner host — see ansible/README.md's Secrets section for the one-time
# setup (mirrors the runner registration's own one-time, human-run step).

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: {} # manual "run now" button, e.g. right after a suspected leak

jobs:
  rotate:
    runs-on: [self-hosted, cabin-m920q]
    steps:
      - name: Pull latest
        run: |
          cd "$DEPLOY_PATH"

          # Fail-closed preflight -- see deploy-cabin-backend.yml's "Pull
          # latest" step for the full incident history. DEPLOY_PATH is a
          # dedicated, automation-only worktree (docs/MAINTENANCE.md's
          # "Two checkouts on the M920q") that should always be clean and
          # on deploy-main.
          DIRTY_STATUS=$(git status --porcelain --untracked-files=all)
          CURRENT_BRANCH=$(git branch --show-current || echo "(detached)")
          if [ -n "$DIRTY_STATUS" ] || [ "$CURRENT_BRANCH" != "deploy-main" ]; then
            echo "::error::Deploy worktree at $DEPLOY_PATH isn't cleanly on deploy-main (branch: $CURRENT_BRANCH) -- refusing to fetch/reset/deploy. Investigate on the host, then re-run."
            if [ -n "$DIRTY_STATUS" ]; then
              printf '%s\n' "$DIRTY_STATUS" | while IFS= read -r line; do
                echo "::error::  $line"
              done
            fi
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin-deploy' }}

      - name: Run the rotation playbook
        run: |
          cd "$DEPLOY_PATH/ansible"
          ansible-playbook -i inventory.ini playbooks/rotate-secrets.yml \
            --limit cabin \
            --vault-password-file "$HOME/.ansible_vault_pass"
        env:
          DEPLOY_PATH: ${{ vars.CABIN_REPO_PATH || '/home/nate/FaceoftheCabin-deploy' }}
