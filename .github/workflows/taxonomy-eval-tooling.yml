name: Taxonomy eval tooling
on:
  pull_request:
    paths:
      - 'docs/ai-assistant/taxonomy-eval/**'
      - '.github/workflows/taxonomy-eval-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'docs/ai-assistant/taxonomy-eval/**'
      - '.github/workflows/taxonomy-eval-tooling.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the taxonomy harness
        run: |
          python3 -m venv /tmp/taxonomy-venv
          /tmp/taxonomy-venv/bin/python -m pip install PyYAML
          cd docs/ai-assistant/taxonomy-eval
          /tmp/taxonomy-venv/bin/python -B -m unittest discover -s . -p 'test_*.py' -v
          /tmp/taxonomy-venv/bin/python -B questions_check.py
      - name: Is elements.json still the current ontology (informational)
        continue-on-error: true
        run: python3 -B docs/ai-assistant/taxonomy-eval/extract_elements.py verify
